  /api/policies/{policyId}:
    get:
      tags:
      - policies
      summary: 정책 상세 조회
      description: '정책 상세 정보를 반환합니다. 인증은 HttpOnly 쿠키(JWT)로 처리됩니다.

        '
      operationId: policies_getPolicyDetail
      parameters:
      - name: policyId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 정책 상세 PK
        example: 8800123
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - policyId
                - title
                - updatedAt
                - status
                - descriptionText
                properties:
                  status:
                    type: object
                    description: 상태/필터 정보(화면 상단 배지/필터 표시용)
                    required:
                    - periodStatus
                    properties:
                      periodStatus:
                        type: string
                        description: 기간 상태
                        enum:
                        - OPEN
                        - UPCOMING
                        - CLOSED
                        - ALWAYS
                        example: OPEN
                      regionFilter:
                        type: string
                        nullable: true
                        description: 지역 필터 요약(있으면 표시)
                        example: 서울특별시
                      category:
                        type: string
                        nullable: true
                        description: 정책 분야(있으면 표시)
                        example: 주거
                  policyId:
                    type: integer
                    format: int64
                    description: 정책 상세 PK
                    example: 8800123
                  title:
                    type: string
                    description: 정책명
                    example: 청년 월세 지원 사업
                  policyNo:
                    type: string
                    nullable: true
                    description: 정책번호(원천에서 제공되는 식별자, 없으면 null)
                    example: P-2026-001122
                  updatedAt:
                    type: string
                    format: date-time
                    description: 최종 수정일(ISO-8601)
                    example: '2025-12-29T00:10:15+09:00'
                  viewCount:
                    type: integer
                    format: int64
                    nullable: true
                    description: 조회수(선택, 없으면 null)
                    example: 12034
                  scrapCount:
                    type: integer
                    format: int64
                    nullable: true
                    description: 스크랩 수(선택, 없으면 null)
                    example: 532
                  descriptionText:
                    type: string
                    description: 정책 설명(본문 텍스트)
                    example: 본 사업은 청년의 주거비 부담을 완화하기 위해 월세를 지원합니다...
                  summary:
                    type: object
                    nullable: true
                    description: 정책 요약(있으면 표시)
                    properties:
                      field:
                        type: string
                        nullable: true
                        description: 정책분야
                        example: 주거
                      benefit:
                        type: string
                        nullable: true
                        description: 지원내용
                        example: 월 최대 20만원 지원
                      operatingPeriod:
                        type: string
                        nullable: true
                        description: 사업 운영 기간
                        example: 2026-01-01 ~ 2026-12-31
                      applicationPeriod:
                        type: string
                        nullable: true
                        description: 사업 신청 기간
                        example: 2026-01-01 ~ 2026-01-31
                      scale:
                        type: string
                        nullable: true
                        description: 지원 규모(명 등)
                        example: 총 5,000명
                  eligibility:
                    type: object
                    nullable: true
                    description: 신청자격(항목별 텍스트)
                    properties:
                      age:
                        type: string
                        nullable: true
                        example: 만 19~34세
                      region:
                        type: string
                        nullable: true
                        example: 서울 거주
                      income:
                        type: string
                        nullable: true
                        example: 중위소득 150% 이하
                      education:
                        type: string
                        nullable: true
                        example: 무관
                      major:
                        type: string
                        nullable: true
                        example: 무관
                      employmentStatus:
                        type: string
                        nullable: true
                        example: 재직/미취업 모두 가능
                      specializedField:
                        type: string
                        nullable: true
                        example: 무관
                      additionalNotes:
                        type: string
                        nullable: true
                        example: 임대차계약서 필수
                      restricted:
                        type: string
                        nullable: true
                        example: 기타 동일/유사 사업 중복 수혜자
                  application:
                    type: object
                    nullable: true
                    description: 신청방법(절차/제출서류/사이트)
                    properties:
                      procedure:
                        type: string
                        nullable: true
                        example: 온라인 신청 → 서류 심사 → 발표
                      screeningAndResult:
                        type: string
                        nullable: true
                        example: 서류 심사 후 개별 통보
                      siteUrl:
                        type: string
                        format: uri
                        nullable: true
                        description: 신청 사이트 URL(있으면 제공)
                        example: https://example.gov/apply
                      documents:
                        type: string
                        nullable: true
                        example: 주민등록등본, 임대차계약서, 소득증빙
                  etc:
                    type: object
