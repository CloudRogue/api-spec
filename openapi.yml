  /api/mypage/profile:
    get:
      tags:
      - mypage
      summary: 맞춤 프로필 조회
      operationId: mypage_getProfile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - name
                - gender
                - birthDate
                - regionSigungu
                - householdSize
                - householdRole
                - incomeDecile
                - onboardingCompleted
                properties:
                  name:
                    type: string
                    description: 사용자 이름(표시용)
                    example: 홍길동
                  gender:
                    type: string
                    description: 성별
                    enum: [MALE, FEMALE, OTHER, UNKNOWN]
                    example: MALE
                  birthDate:
                    type: string
                    format: date
                    description: 생년월일(YYYY-MM-DD). 연령 조건 판단에 사용됩니다.
                    example: '1999-01-01'
                  regionSigungu:
                    type: string
                    description: 거주지역(시군구). 맞춤 공고 필터링에 사용됩니다.
                    example: 서울특별시 마포구
                  householdSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                    description: 가구원 수(1 이상). 공고 자격 판단/추천에 사용될 수 있습니다.
                    example: 1
                  householdRole:
                    type: string
                    description: 세대 내 역할(세대주/세대원)
                    enum: [HOUSEHOLDER, MEMBER]
                    example: HOUSEHOLDER
                  incomeDecile:
                    type: integer
                    minimum: 1
                    maximum: 10
                    description: 소득분위(1~10). 공고 소득요건 판단/추천에 사용됩니다.
                    example: 4
                  onboardingCompleted:
                    type: boolean
                    description: 초기 온보딩(필수 프로필 입력) 완료 여부
                    example: true
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    name: 홍길동
                    gender: MALE
                    birthDate: '1999-01-01'
                    regionSigungu: 서울특별시 마포구
                    householdSize: 1
                    householdRole: HOUSEHOLDER
                    incomeDecile: 4
                    onboardingCompleted: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
      - mypage
      summary: 맞춤 프로필 생성/전체 저장 (초기 온보딩 포함)
      description: |
        맞춤 프로필을 생성하거나 전체 필드를 덮어씁니다. 초기 온보딩 입력에도 사용됩니다.
        소득 정보는 월급이 아닌 '소득분위(1~10)'를 입력받습니다.
      operationId: mypage_putProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - gender
              - birthDate
              - regionSigungu
              - householdSize
              - householdRole
              - incomeDecile
              properties:
                name:
                  type: string
                  maxLength: 10
                  description: 사용자 이름(표시용)
                  example: 홍길동
                gender:
                  type: string
                  description: 성별
                  enum: [MALE, FEMALE, OTHER, UNKNOWN]
                  example: MALE
                birthDate:
                  type: string
                  format: date
                  description: 생년월일(YYYY-MM-DD). 연령 조건 판단에 사용됩니다.
                  example: '1999-01-01'
                regionSigungu:
                  type: string
                  maxLength: 100
                  description: 거주지역(시군구). 맞춤 공고 필터링에 사용됩니다.
                  example: 서울특별시 마포구
                householdSize:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: 가구원 수(1 이상).
                  example: 1
                householdRole:
                  type: string
                  description: 세대 내 역할(세대주/세대원)
                  enum: [HOUSEHOLDER, MEMBER]
                  example: HOUSEHOLDER
                incomeDecile:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: 소득분위(1~10). 공고 소득요건 판단/추천에 사용됩니다.
                  example: 4
      responses:
        '204':
          description: No Content (저장 완료)
        '400':
          description: Validation Error (지역 코드/형식 오류 등)
          content:
            application/json:
              schema:
                type: object
                required: [code, message, status, details]
                properties:
                  code: { type: string }
                  message: { type: string }
                  status: { type: integer }
                  details:
                    type: object
                    required: [field, reason]
                    properties:
                      field: { type: string }
                      reason: { type: string }
              examples:
                invalidRegionSigungu:
                  value:
                    code: INVALID_REGION_SIGUNGU
                    message: 유효하지 않은 거주지역(시군구)입니다.
                    status: 400
                    details:
                      field: regionSigungu
                      reason: regionSigungu 값이 올바르지 않습니다.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
      - mypage
      summary: 맞춤 프로필 부분 수정
      description: '전달된 필드만 수정됩니다. userId는 ULID를 사용합니다.

        '
      operationId: patch_mypage_profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: '전달된 필드만 수정됩니다. 포함되지 않은 필드는 변경되지 않습니다.

                '
              properties:
                name:
                  type: string
                  maxLength: 10
                  example: 홍길동
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER, UNKNOWN]
                  example: MALE
                birthDate:
                  type: string
                  format: date
                  description: 생년월일(YYYY-MM-DD). 연령 조건 판단에 사용됩니다.
                  example: '1999-01-01'
                regionSigungu:
                  type: string
                  maxLength: 100
                  description: 거주지역(시군구). 맞춤 공고 필터링에 사용됩니다.
                  example: 서울특별시 마포구
                householdSize:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 1
                householdRole:
                  type: string
                  enum: [HOUSEHOLDER, MEMBER]
                  example: HOUSEHOLDER
                incomeDecile:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 4
      responses:
        '204':
          description: No Content (수정 완료)
        '400':
          description: Validation Error (지역 코드/형식 오류 등)
          content:
            application/json:
              schema:
                type: object
                required: [code, message, status, details]
                properties:
                  code: { type: string }
                  message: { type: string }
                  status: { type: integer }
                  details:
                    type: object
                    required: [field, reason]
                    properties:
                      field: { type: string }
                      reason: { type: string }
              examples:
                invalidRegionSigungu:
                  value:
                    code: INVALID_REGION_SIGUNGU
                    message: 유효하지 않은 거주지역(시군구)입니다.
                    status: 400
                    details:
                      field: regionSigungu
                      reason: regionSigungu 값이 올바르지 않습니다.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


