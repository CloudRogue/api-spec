  /api/announcements/{announcementId}/summary:
    get:
      tags: [announcements]
      summary: 공고 요약(kvDigest) 조회
      description: >
        공고 요약본을 반환합니다.
        kvDigest는 공고 요약을 위한 JSON 가변 필드이며, key/value 쌍의 목록으로 구성됩니다.
        이 데이터는 원문(PDF 등) 및 내부 요약 결과를 기반으로 생성된 "요약"이며,
        정확성을 보장하지 않으므로 원문 확인이 필요합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: announcements_getAnnouncementSummary
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 12345
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [kvDigest]
                properties:
                  kvDigest:
                    type: array
                    description: 공고 요약본(JSON 가변 필드) - key/value 목록
                    items:
                      type: object
                      required: [key, value]
                      additionalProperties: false
                      properties:
                        key:
                          type: string
                          description: 요약 항목명
                          example: "청약 기간"
                        value:
                          type: string
                          description: 요약 내용
                          example: "2년간 꾸준히 납입하면 우선순위"
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    kvDigest:
                      - key: "청약 기간"
                        value: "2년간 꾸준히 납입하면 우선순위"
                      - key: "납입 인정 기준"
                        value: "월 10만원 이상 납입 시 인정"
                      - key: "유의사항"
                        value: "서류 미제출 시 자동 탈락"
                mock2:
                  summary: Scenario 2
                  value:
                    kvDigest:
                      - key: "모집 대상"
                        value: "무주택 청년(만 19~39세) 우선"
                      - key: "필수 요건"
                        value: "주택청약종합저축 가입 6개월 이상 + 6회 이상 납입"
                      - key: "유의사항"
