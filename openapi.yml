  /api/regions/cities:
    get:
      tags:
        - regions
      summary: 시(시도) 목록 조회
      description: >
        대한민국 시(시도/광역) 목록을 반환합니다.
  
      operationId: regions_getCities
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              schema: { type: string }
              example: "public, max-age=86400"
            ETag:
              schema: { type: string }
              example: "\"regions-cities-v1\""
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    description: 시(시도/광역) 목록
                    items:
                      type: object
                      required:
                        - cityCode
                        - cityName
                      properties:
                        cityCode:
                          type: string
                          description: 시(시도) 코드(2자리)
                          pattern: "^[0-9]{2}$"
                          example: "11"
                        cityName:
                          type: string
                          description: 시(시도) 명칭
                          example: "서울특별시"
                  meta:
                    type: object
                    required:
                      - version
                      - totalElements
                    properties:
                      version:
                        type: string
                        description: 지역 데이터 버전(변경 감지용)
                        example: "2026-01-07"
                      totalElements:
                        type: integer
                        minimum: 0
                        example: 900001

                        description: 전체 항목 수
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    data:
                      - cityCode: "11"
                        cityName: "서울특별시"
                      - cityCode: "26"
                        cityName: "부산광역시"
                    meta:
                      version: "2026-01-07"
                      totalElements: 17
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/regions/sigungu:
    get:
      tags:
        - regions
      summary: 시군구 목록 조회 (시 코드 기준)
      description: >
        시(시도) 코드(cityCode)에 해당하는 시군구 목록을 반환합니다.
    
      operationId: regions_getSigunguByCityCode
      parameters:
        - name: cityCode
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{2}$"
          description: 시(시도) 코드(2자리). 예) 서울=11
          example: "11"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              schema: { type: string }
              example: "public, max-age=86400"
            ETag:
              schema: { type: string }
              example: "\"regions-sigungu-11-v1\""
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    description: 시군구 목록
                    items:
                      type: object
                      required:
                        - sigunguCode
                        - sigunguName
                      properties:
                        sigunguCode:
                          type: string
                          description: 시군구 코드(5자리)
                          pattern: "^[0-9]{5}$"
                          example: "11140"
                        sigunguName:
                          type: string
                          description: 시군구 명칭
                          example: "마포구"
                  meta:
                    type: object
                    required:
                      - cityCode
                      - version
                      - totalElements
                    properties:
                      cityCode:
                        type: string
                        description: 요청한 시(시도) 코드
                        example: "11"
                      version:
                        type: string
                        description: 지역 데이터 버전(변경 감지용)
                        example: "2026-01-07"
                      totalElements:
                        type: integer
                        minimum: 0
                        example: 25
                        description: 전체 항목 수
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    data:
                      - sigunguCode: "11110"
                        sigunguName: "종로구"
                      - sigunguCode: "11140"
                        sigunguName: "마포구"
                    meta:
                      cityCode: "11"
                      version: "2026-01-07"
                      totalElements: 25
        "400":
          description: Bad Request (cityCode 형식 오류 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      $ref: ./components/schemas/common.yml#/ErrorResponse
    PageMeta:
      $ref: ./components/schemas/common.yml#/PageMeta
