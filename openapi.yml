  /api/community/comments/{commentPk}:
    patch:
      tags:
      - community
      summary: 댓글 수정
      description: 작성자만 수정 가능합니다. 소프트 삭제된 댓글은 정책에 따라 수정이 제한될 수 있습니다.
      operationId: community_updateComment
      parameters:
      - name: commentPk
        in: path
        required: true
        description: 수정할 댓글 PK
        schema:
          type: integer
          format: int64
          example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 댓글 수정 요청
              required:
              - content
              properties:
                content:
                  type: string
                  description: 수정할 댓글 내용
                  example: 조건이 변경됐을 수도 있으니 공고 원문도 확인해보세요.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 댓글 수정 응답
                required:
                - id
                - updatedAt
                properties:
                  id:
                    type: integer
                    format: int64
                    description: 댓글 PK
                    example: 123
                  updatedAt:
                    type: string
                    format: date-time
                    description: 수정 시각
                    example: '2025-12-29T09:20:00+09:00'
