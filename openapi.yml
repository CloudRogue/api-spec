  /api/announcements/search/closed:
    get:
      tags:
        - announcements
      summary: 전체 공고 목록 조회 (마감)
      description: >
        전체 공고 목록(마감)입니다. 인증은 선택 사항입니다. 인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
        정렬은 시간순(최신순)으로 고정됩니다.
      operationId: announcements_getAnnouncementsClosed
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: 다음 페이지 조회를 위한 커서. 최초 조회 시 생략
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 페이지 크기
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    description: 공고 목록(시간순 정렬)
                    items:
                      type: object
                      required: [announcementId, title, startDate, endDate, publishedAt, publisher, status]
                      properties:
                        announcementId:
                          type: integer
                          format: int64
                          description: 공고 PK
