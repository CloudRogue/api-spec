                      notes:
                        type: string
                        nullable: true
                        description: 예외/특기사항(정규화가 어려운 내용만)
                        example: 일부 유형은 신혼부부 우선
                  originalUrl:
                    type: string
                    format: uri
                    description: 원문 공고 링크(외부 URL, PDF/HWP 포함 가능)
                    example: https://example.org/announcements/12345/original
                  externalApplyUrl:
