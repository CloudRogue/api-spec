        - announcements-management
      summary: (사용자) 신청 관리 - 발표 완료(CLOSED) 공고 목록 조회
      description: >
        모든 전형이 종료되어 최종 결과가 발표된 공고 목록(CLOSED)을
        커서 기반 무한 스크롤로 조회합니다.

        - cursor가 없으면 최초 페이지로 간주합니다.
        - meta.nextCursor, meta.hasNext 로 다음 페이지를 조회합니다.
      operationId: announcements_getApplicationManageClosed
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 마지막으로 조회한 announcementId(다음 조회 시작 기준)
          example: 4006
        - name: size
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
          description: 페이지 크기
          example: 5

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - summary
                  - data
                  - meta
                properties:
                  summary:
                    type: object
                    additionalProperties: false
                    required:
                      - applyingCount
                      - documentWaitingCount
                      - finalWaitingCount
                      - closedCount
                    properties:
                      applyingCount:
                        type: integer
                        format: int32
                        minimum: 0
                        example: 3
                      documentWaitingCount:
                        type: integer
                        format: int32
                        minimum: 0
                        example: 5
                      finalWaitingCount:
                        type: integer
                        format: int32
                        minimum: 0
                        example: 2
                      closedCount:
                        type: integer
                        format: int32
                        minimum: 0
                        description: 발표 완료(CLOSED) 공고 총 개수
                        example: 12

                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - announcementId
                        - title
                        - dDay
                        - publisher
                        - noticeType
                        - currentStatus
                        - finalPublishedAt
                      properties:
                        announcementId:
                          type: integer
                          format: int64
                          example: 900001
                        title:
                          type: string
                          example: "2025년 하반기 청년 매입임대주택 모집 (서울)"
                        dDay:
                          type: integer
                          format: int32
                          example: 0
                        publisher:
                          type: string
                          example: "LH 한국토지주택공사"
                        noticeType:
                          type: string
                          description: 공고 유형(표시용)
                          example: "매입임대"
                        currentStatus:
                          type: string
                          enum: [CLOSED]
                          example: "CLOSED"
                        finalPublishedAt:
                          type: string
                          format: date-time
                          example: "2026-01-17T18:00:00"

                  meta:
                    type: object
                    additionalProperties: false
                    required:
                      - nextCursor
                      - hasNext
                      - size
                    properties:
                      nextCursor:
                        type: integer
                        format: int64
                        nullable: true
                        example: 4000
                      hasNext:
                        type: boolean
                        example: false
                      size:
                        type: integer
                        format: int32
                        example: 5

              examples:
                ok:
                  summary: CLOSED 목록 예시
                  value:
                    summary:
                      applyingCount: 3
                      documentWaitingCount: 5
                      finalWaitingCount: 2
                      closedCount: 12
                    data:
                      - announcementId: 900001
                        title: "2025년 하반기 청년 매입임대주택 모집 (서울)"
                        dDay: 0
                        publisher: "LH 한국토지주택공사"
                        noticeType: "매입임대"
                        currentStatus: "CLOSED"
                        finalPublishedAt: "2026-01-17T18:00:00"
                    meta:
                      nextCursor: 4000
                      hasNext: false
                      size: 5

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/announcements/application-manage/{announcementId}/detail:
    get:
      tags: [announcements-management]
      summary: (사용자) 신청 관리 - 준비 화면 데이터 조회
      description: >
        특정 공고(announcementId)에 대한 신청 관리 "준비" 화면 데이터를 조회합니다.

       
      operationId: announcements_getApplicationManagePreparation
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 공고 PK
          example: 900001

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - announcementId
                  - title
                  - dDay
                  - publisher
                  - housingType
                  - currentStatus
                  - endDate
                  - applyUrl
                  - apply
                  - docResult
                  - finalResult
                properties:
                  announcementId:
                    type: integer
                    format: int64
                    description: 공고 PK
                    example: 900001

                  title:
                    type: string
                    description: 공고 제목
                    example: "제1차 서울특별시 장기안심주택 입주자 모집"

                  dDay:
                    type: integer
                    format: int32
                    description: 공고 마감 D-Day (마감일 기준, 오늘이 마감이면 0)
                    example: 1

                  publisher:
                    type: string
                    description: 공고 게시 기관
                    example: "SH 서울주택도시공사"

                  housingType:
                    type: string
                    description: 주택 유형(표시용)
                    example: "주택"

                  currentStatus:
                    type: string
                    description: 공고 현재 상태(표시용/업무용)
                    example: "APPLYING"

                  endDate:
                    type: string
                    format: date-time
                    description: 공고 접수 마감 일시
                    example: "2026-01-15T18:00:00"

                  applyUrl:
                    type: string
                    format: uri
                    description: 공고 지원하기 링크
                    example: https://example.com/apply/notice/2005

                  apply:
                    type: object
                    additionalProperties: false
                    required: [date, documents]
                    properties:
                      date:
                        type: string
                        format: date
                        nullable: true
                        description: 공고 접수 마감일
                        example: "2026-01-15"
                      documents:
                        type: array
                        description: 공고 접수 단계 필요 서류
                        items:
                          type: object
                          additionalProperties: false
                          required: [id, name, scope]
                          properties:
                            id:
                              type: integer
                              format: int64
                              description: 문서 식별자
                              example: 900001
                            name:
                              type: string
                              description: 서류명
                              example: 주민등록등본
                            scope:
                              type: string
                              enum: [COMMON, TARGET_ONLY]
                              description: 서류 범위
                              example: COMMON

                  docResult:
                    type: object
                    additionalProperties: false
                    required: [date, documents]
                    properties:
                      date:
                        type: string
                        format: date
                        nullable: true
                        description: 서류대상자 발표일
                        example: "2026-02-01"
                      documents:
                        type: array
                        description: 서류대상자 발표 단계 필요 서류
                        items:
                          type: object
                          additionalProperties: false
                          required: [id, name, scope]
                          properties:
                            id:
                              type: integer
                              format: int64
                              description: 문서 식별자
                              example: 900001
                            name:
                              type: string
                              description: 서류명
                              example: 청약저축 순위확인서
                            scope:
                              type: string
                              enum: [COMMON, TARGET_ONLY]
                              description: 서류 범위
                              example: TARGET_ONLY

                  finalResult:
                    type: object
                    additionalProperties: false
                    required: [date, summary]
                    properties:
                      date:
                        type: string
                        format: date
                        nullable: true
                        description: 당첨자 발표일
                        example: "2026-02-15"
                      summary:
                        type: string
                        nullable: true
                        description: 최종 단계 요약(표시용 한 줄)
                        example: "서울 강남/마포 대상 청년 임대주택 모집, LH 청약플러스 온라인 접수."
              examples:
                ok:
                  summary: 준비 화면 조회 예시
                  value:
                    announcementId: 900001
                    title: "제1차 서울특별시 장기안심주택 입주자 모집"
                    dDay: 1
                    publisher: "SH 서울주택도시공사"
                    housingType: "주택"
                    currentStatus: "APPLYING"
                    endDate: "2026-01-15T18:00:00"

                    applyUrl: "https://example.com/apply/notice/2005"
                    apply:
                      date: "2026-01-15"
                      documents:
                        - id: 900001
                          name: "주민등록등본"
                          scope: "COMMON"
                    docResult:
                      date: "2026-02-01"
                      documents:
                        - id: 900001
                          name: "청약저축 순위확인서"
                          scope: "TARGET_ONLY"
                    finalResult:
                      date: "2026-02-15"
                      summary: "서울 강남/마포 대상 청년 임대주택 모집, LH 청약플러스 온라인 접수."


  /api/required-onboardings:
    get:
      tags: [onboarding]
      summary: 필수 온보딩 질문 목록 조회
      description: >
        필수 온보딩 질문 목록을 조회합니다.
        필수 온보딩은 전체 목록을 반환합니다.
        select 타입(select_single/select_multi)인 경우 options(선택지 목록)을 함께 반환합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: onboarding_getRequiredOnboardingList
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    description: 필수 온보딩 질문 목록
                    items:
                      type: object
                      additionalProperties: false
                      required: [requiredOnboardingId, title, description, question, type, options]
                      properties:
                        requiredOnboardingId: { type: integer, format: int64, example: 900001 }
                        title: { type: string, example: "필수 온보딩 타이틀" }
                        description: { type: string, example: "설명" }
                        question: { type: string, example: "질문" }
                        type:
                          type: string
                          enum: [boolean, text_input, number_input, select_single, select_multi]
                          example: "text_input"
                        options:
                          type: array
                          nullable: true
                          minItems: 1
                          items: { type: string }
                          description: >
                            선택 가능한 옵션 목록.
                            - type이 select_single/select_multi 인 경우: 배열(최소 1개)
                            - 그 외 타입인 경우: null
              examples:
                mock:
                  summary: Scenario 1
                  value:
                    data:
                      - requiredOnboardingId: 900001
                        title: "필수 온보딩 타이틀"
                        description: "설명"
                        question: "필수 질문(예: 이름을 입력해주세요)"
                        type: "text_input"
                        options: null
                      - requiredOnboardingId: 900001
                        title: "필수 온보딩 타이틀"
                        description: "설명"
                        question: "단일 선택 질문"
                        type: "select_single"
                        options: ["옵션A", "옵션B"]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }


  /api/onboardings:
    get:
      tags: [onboarding]
      summary: 추가 온보딩 질문(복수) 조회
      description: >
        추가 온보딩 PK 목록(ids)에 해당하는 질문을 한 번에 조회합니다.
        additionalOnboardingId 1개당 질문은 1개입니다.
        select 타입(select_single/select_multi)인 경우 options(선택지 목록)을 함께 반환합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: onboarding_getAdditionalOnboardingBatch
      parameters:
        - name: ids
          in: query
          required: true
          description: 조회할 추가 온보딩 PK 목록
          schema:
            type: array
            items: { type: integer, format: int64 }
            minItems: 1
          style: form
          explode: false
          example: [900001, 900002, 900003]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    description: 추가 온보딩 질문 목록(각 id당 1개)
                    items:
                      type: object
                      additionalProperties: false
                      required: [additionalOnboardingId, title, description, question, type, options]
                      properties:
                        additionalOnboardingId: { type: integer, format: int64, example: 900001 }
                        title: { type: string, example: "청약통장 정보 입력해주세요" }
                        description: { type: string, example: "청약통장은 어띠어띠해요" }
                        question: { type: string, example: "청약통장이 있으신가요?" }
                        type:
                          type: string
                          enum: [boolean, text_input, number_input, select_single, select_multi]
                          example: "boolean"
                        options:
                          type: array
                          nullable: true
                          minItems: 1
                          items: { type: string }
                          description: >
                            선택 가능한 옵션 목록.
                            - type이 select_single/select_multi 인 경우: 배열(최소 1개)
                            - 그 외 타입인 경우: null
              examples:
                mock:
                  summary: ids=900001,900002,900003,900004,900005
                  value:
                    data:
                      - additionalOnboardingId: 900001
                        title: "청약통장 정보 입력해주세요"
                        description: "청약통장은 어띠어띠해요"
                        question: "청약통장이 있으신가요?"
                        type: "boolean"
                        options: null
                      - additionalOnboardingId: 900001
                        title: "온보딩 타이틀"
                        description: "설명"
                        question: "단일 선택 질문"
                        type: "select_single"
                        options: ["옵션A", "옵션B", "옵션C"]
                      - additionalOnboardingId: 900001
                        title: "온보딩 타이틀"
                        description: "설명"
                        question: "복수 선택 질문"
                        type: "select_multi"
                        options: ["옵션A", "옵션B", "옵션C"]
                      - additionalOnboardingId: 900001
                        title: "온보딩 타이틀"
                        description: "설명"
                        question: "텍스트를 입력해주세요"
                        type: "text_input"
                        options: null
                      - additionalOnboardingId: 900001
                        title: "온보딩 타이틀"
                        description: "설명"
                        question: "숫자를 입력해주세요"
                        type: "number_input"
                        options: null
        "400":
          description: Bad Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              
    post:
      tags: [onboarding]
      summary: 추가 온보딩 답변(복수) 일괄 제출
      description: >
        추가 온보딩 PK별 답변을 한 번에 제출합니다.

        규칙(클라/서버 공통):
        - additionalOnboardingId, type, unknown, value는 항상 포함합니다.
        - unknown=true(모르겠어요)이면 value는 반드시 null 입니다.
        - unknown=false이면 type에 맞는 value를 채웁니다.
          (boolean -> true/false,
          select_single -> string,
          select_multi -> string[],
          text_input -> string,
          number_input -> number)

        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: onboarding_submitAdditionalOnboardingAnswersBatch

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answers]
              properties:
                answers:
                  type: array
                  minItems: 1
                  items:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required: [additionalOnboardingId, type, unknown, value]
                        properties:
                          additionalOnboardingId: { type: integer, format: int64, example: 900001 }
                          type: { type: string, enum: [boolean] }
                          unknown: { type: boolean, example: false }
                          value:
                            type: boolean
                            nullable: true
                            description: unknown=true이면 null, unknown=false이면 true/false

                      - type: object
                        additionalProperties: false
                        required: [additionalOnboardingId, type, unknown, value]
                        properties:
                          additionalOnboardingId: { type: integer, format: int64, example: 900002 }
                          type: { type: string, enum: [select_single] }
                          unknown: { type: boolean, example: false }
                          value:
                            type: string
                            nullable: true
                            description: unknown=true이면 null, unknown=false이면 선택값(단일)

                      - type: object
                        additionalProperties: false
                        required: [additionalOnboardingId, type, unknown, value]
                        properties:
                          additionalOnboardingId: { type: integer, format: int64, example: 900003 }
                          type: { type: string, enum: [select_multi] }
                          unknown: { type: boolean, example: false }
                          value:
                            type: array
                            items: { type: string }
                            nullable: true
                            description: unknown=true이면 null, unknown=false이면 선택값 배열(복수)

                      - type: object
                        additionalProperties: false
                        required: [additionalOnboardingId, type, unknown, value]
                        properties:
                          additionalOnboardingId: { type: integer, format: int64, example: 900004 }
                          type: { type: string, enum: [text_input] }
                          unknown: { type: boolean, example: false }
                          value:
                            type: string
                            nullable: true
                            description: unknown=true이면 null, unknown=false이면 입력 문자열

                      - type: object
                        additionalProperties: false
                        required: [additionalOnboardingId, type, unknown, value]
                        properties:
                          additionalOnboardingId: { type: integer, format: int64, example: 900005 }
                          type: { type: string, enum: [number_input] }
                          unknown: { type: boolean, example: false }
                          value:
                            type: number
                            nullable: true
                            description: unknown=true이면 null, unknown=false이면 숫자

            examples:
              submit_ok:
                summary: 정상 제출(unknown=false)
                value:
                  answers:
                    - additionalOnboardingId: 900001
                      type: boolean
                      unknown: false
                      value: true
                    - additionalOnboardingId: 900001
                      type: select_single
                      unknown: false
                      value: "옵션A"
                    - additionalOnboardingId: 900001
                      type: select_multi
                      unknown: false
                      value: ["옵션A", "옵션B"]
                    - additionalOnboardingId: 900001
                      type: text_input
                      unknown: false
                      value: "2020-03-01"
                    - additionalOnboardingId: 900001
                      type: number_input
                      unknown: false
                      value: 12

              submit_unknown:
                summary: 모르겠어요(unknown=true -> value는 null 고정)
                value:
                  answers:
                    - additionalOnboardingId: 900001
                      type: boolean
                      unknown: true
                      value: null
                    - additionalOnboardingId: 900001
                      type: select_multi
                      unknown: true
                      value: null

      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request (unknown/value/type 규칙 위반)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    

  /api/mypage/profile:
    get:
      tags: [mypage]
