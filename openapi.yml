  /api/admin/announcements/{announcementId}:
    get:
      tags: [admin]
      summary: (어드민) 공고 AI PDF 요약/추출 결과 조회(참고용, KV 리스트)
      description: >
        공고(announcementId)에 대해 AI가 PDF를 읽고 요약한 결과를 조회합니다.
        이 API는 정확성을 보장하지 않으며 참고용입니다.

        ✅ 응답에는 공고 기본정보 + kvDigest(KV 리스트)를 포함합니다.
        kvDigest의 value는 문자열만 허용합니다(중첩 object/배열 금지).

        ⚠️ Publisher가 SH인 경우 **announcementId/publisher/title/url/applyUrl을 제외한 모든 필드가 null**일 수 있습니다. 예제 참고

        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: admin_getAnnouncementAiDigest
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 900001
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - announcementId
                  - publisher
                  - title
                  - url
                  - applyUrl
                  - kvDigest
                properties:
                  announcementId:
                    type: integer
                    format: int64
                    description: 공고 PK
                    example: 900001

                  publisher:
                    type: string
                    nullable: true
                    description: 발행처(기관/지자체 등)
                    example: LH 한국토지주택공사

                  title:
                    type: string
                    nullable: true
                    description: 공고명
                    example: Mock title 1

                  housingType:
                    type: string
                    nullable: true
                    description: 주택 유형(앱 뱃지/필터에 사용)
                    example: 행복주택

                  supplyType:
                    type: string
                    nullable: true
                    description: 공급유형(예 임대주택 등)
                    example: 임대주택

                  startDate:
                    type: string
                    format: date
                    nullable: true
                    description: 공고 시작일
                    example: "2026-01-01"

                  endDate:
                    type: string
                    format: date
                    nullable: true
                    description: 공고 마감일
                    example: "2026-01-15"

                  documentPublishedAt:
                    type: string
                    format: date
                    nullable: true
                    description: 서류발표일
                    example: "2026-02-01"

                  finalPublishedAt:
                    type: string
                    format: date
                    nullable: true
                    description: 최종 발표일(당첨자 발표일)
                    example: "2026-02-15"

                  status:
                    type: string
                    nullable: true
                    description: 공고 접수 상태. startDate/endDate로 계산됩니다.
                    enum: [OPEN, DUE_SOON, UPCOMING, CLOSED]
                    example: OPEN

                  dDay:
                    type: integer
                    nullable: true
                    description: 마감까지 남은 일수(endDate - today). OPEN/DUE_SOON에서 의미가 있습니다.
                    example: 7

                  rentGtn:
                    type: number
                    nullable: true
                    description: 최소임대보증금
                    example: 5000000

                  enty:
                    type: number
                    nullable: true
                    description: 최소_계약금
                    example: 500000

                  prtpay:
                    type: number
                    nullable: true
                    description: 최소_중도금
                    example: 1000000

                  surlus:
                    type: number
                    nullable: true
                    description: 최소_잔금
                    example: 3500000

                  mtRntchrg:
                    type: number
                    nullable: true
                    description: 최소월임대료
                    example: 250000

                  fullAdres:
                    type: string
                    nullable: true
                    description: 전체주소
                    example: 서울특별시 강남구 ...

                  refrnLegaldongNm:
                    type: string
                    nullable: true
                    description: 참조_법정동명 (주소가 지번주소일 때 표시)
                    example: 역삼동

                  url:
                    type: string
                    format: uri
                    nullable: true
                    description: 모집공고 URL
                    example: https://example.com/1

                  # ✅ 추가: 신청하러가기 URL
                  applyUrl:
                    type: string
                    format: uri
                    nullable: true
                    description: 신청하러가기 URL
                    example: https://apply.example.com/1

                  isScrapped:
                    type: boolean
                    nullable: true
                    description: 로그인 사용자 기준 찜 여부. 비로그인 시 null
                    example: false

                  kvDigest:
                    type: array
                    description: >
                      AI가 PDF에서 뽑아낸 요약 결과(KV 리스트).
                      value는 문자열만 허용(중첩 구조 금지).
                    items:
                      type: object
                      required: [key, value]
                      additionalProperties: false
                      properties:
                        key:
                          type: string
                          description: 항목명
                          example: 청약 기간
                        value:
                          type: string
                          nullable: true
                          description: 항목 요약 텍스트 (추출 실패 시 null 가능)
                          example: 2년간 꾸준히 납입하면 우선순위
              examples:
                mock1:
                  summary: Scenario (LH, filled)
                  value:
                    announcementId: 900001

                    publisher: LH 한국토지주택공사
                    title: Mock title 1
                    housingType: 행복주택
                    supplyType: 임대주택
                    startDate: "2026-01-01"
                    endDate: "2026-01-15"
                    documentPublishedAt: "2026-02-01"
                    finalPublishedAt: "2026-02-15"
                    status: OPEN
                    dDay: 7
                    rentGtn: 5000000
                    enty: 500000
                    prtpay: 1000000
                    surlus: 3500000
                    mtRntchrg: 250000
                    fullAdres: 서울특별시 강남구 ...
                    refrnLegaldongNm: 역삼동
                    url: https://example.com/1
                    applyUrl: https://apply.example.com/1
                    isScrapped: false
                    kvDigest:
                      - key: "청약 기간"
                        value: "2년간 꾸준히 납입하면 우선순위"
                      - key: "유의사항"
                        value: "서류 미제출 시 자동 탈락"

                mock_nulls_sh:
                  summary: Scenario (SH, mostly null)
                  value:
                    announcementId: 900001

                    publisher: SH 서울주택도시공사
                    title: "Mock title (SH)"
                    housingType: null
                    supplyType: null
                    startDate: null
                    endDate: null
                    documentPublishedAt: null
                    finalPublishedAt: null
                    status: null
                    dDay: null
                    rentGtn: null
                    enty: null
                    prtpay: null
                    surlus: null
                    mtRntchrg: null
                    fullAdres: null
                    refrnLegaldongNm: null
                    url: https://example.com/1
                    applyUrl: https://apply.example.com/1
                    isScrapped: null
                    kvDigest:
                      - key: "Mock key 1"
                        value: null

        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

        "404":
          description: Not Found (해당 공고의 AI 요약/추출 데이터가 없음)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    

    post:
      tags: [admin]
      summary: (어드민) 공고 입력 통합 저장 (지원자격/제출서류·일정/개요·요약 + 신청하러가기 URI)
      description: >
        어드민이 공고 입력을 **한 번의 요청으로 통합 저장**합니다.

        - ✅ LH/SH 요청 필드 구조는 완전히 동일합니다.
          - LH는 applyEntryUrl(신청하러가기 URI)만 입력하고,
            나머지 최상위 수기 필드들은 **반드시 null**로 전송합니다.
        - submission.dates 입력 규칙
          - SH: applyStartDate/applyEndDate/documentPublishedAt/finalPublishedAt 4개 모두 입력
          - LH: documentPublishedAt만 입력하고 applyStartDate/applyEndDate/finalPublishedAt은 **반드시 null**
        - eligibility.answers 규칙
          - 요청 바디에는 **옵셔널 필드를 포함한 모든 필드가 항상 포함**됩니다.
          - type이 SELECT_* 계열이 아닌 경우 options는 반드시 null
          - type이 SELECT_* 계열인 경우 options는 반드시 배열(빈 배열 금지)

      operationId: admin_upsertAnnouncementDraft
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 900001

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - publisher
                - housingType
                - supplyType
                - regionCode
                - regionName
                - applyUrl
                - applyEntryUrl
                - rentGtn
                - enty
                - prtpay
                - surlus
                - mtRntchrg
                - eligibility
                - submission
                - overviewSummary
              properties:
                publisher:
                  type: string
                  enum: [LH, SH]
                  description: 공고 기관
                  example: SH

                housingType:
                  type: string
                  nullable: true
                  description: 주택 유형 (LH는 null)
                  example: "아파트"
                supplyType:
                  type: string
                  nullable: true
                  description: 공급유형 (LH는 null)
                  example: "공공임대"
                regionCode:
                  type: string
                  nullable: true
                  description: 지역 코드 (LH는 null)
                  example: "11440"
                regionName:
                  type: string
                  nullable: true
                  description: 시군구명 (LH는 null)
                  example: "서울특별시 마포구"

                applyUrl:
                  type: string
                  format: uri
                  nullable: true
                  maxLength: 1000
                  description: 공고 원문 URL (LH는 null)
                  example: "https://www.i-sh.co.kr/apply/notice/12345"

                applyEntryUrl:
                  type: string
                  format: uri
                  nullable: true
                  maxLength: 1000
                  description: 신청하러가기 URI (LH/SH 공통, LH는 이 값만 입력)
                  example: "https://apply.lh.or.kr/"

                rentGtn:
                  type: integer
                  format: int64
                  nullable: true
                  minimum: 0
                  description: 임대보증금(최소) (LH는 null)
                  example: 10000000
                enty:
                  type: integer
                  format: int64
                  nullable: true
                  minimum: 0
                  description: 계약금(최소) (LH는 null)
                  example: 1000000
                prtpay:
                  type: integer
                  format: int64
                  nullable: true
                  minimum: 0
                  description: 중도금(최소) (LH는 null)
                  example: 3000000
                surlus:
                  type: integer
                  format: int64
                  nullable: true
                  minimum: 0
                  description: 잔금(최소) (LH는 null)
                  example: 6000000
                mtRntchrg:
                  type: integer
                  format: int64
                  nullable: true
                  minimum: 0
                  description: 월임대료(최소) (LH는 null)
                  example: 250000

                eligibility:
                  type: object
                  additionalProperties: false
                  required: [answers]
                  properties:
                    answers:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        additionalProperties: false
                        required: [additionalOnboardingId, type, unknown, value, options]
                        properties:
                          additionalOnboardingId:
                            type: integer
                            format: int64
                            description: 추가 온보딩 질문 PK
                            example: 900001
                          type:
                            type: string
                            enum: [BOOLEAN, TEXT_INPUT, NUMBER_INPUT, SELECT_SINGLE, SELECT_MULTI]
                            description: UI 블록 타입
                            example: SELECT_SINGLE
                          unknown:
                            type: boolean
                            description: 모름/미응답 여부 (true면 value는 null 허용)
                            example: false
                          value:
                            nullable: true
                            description: >
                              답변 값. unknown=true이면 null 허용.
                              type별 기대 타입:
                              - BOOLEAN: boolean
                              - TEXT_INPUT/SELECT_SINGLE: string
                              - NUMBER_INPUT: number
                              - SELECT_MULTI: string[]
                            oneOf:
                              - type: boolean
                              - type: string
                              - type: number
                              - type: array
                                items: { type: string }
                            example: "신혼부부"
                          options:
                            nullable: true
                            description: >
                              선택지 배열(항상 포함).
                              - type이 SELECT_SINGLE/SELECT_MULTI인 경우: 배열 필수(빈 배열 금지)
                              - 그 외 type인 경우: 반드시 null
                            oneOf:
                              - type: array
                                minItems: 1
                                items: { type: string }
                            example: ["신혼부부", "생애최초", "청년"]

                submission:
                  type: object
                  additionalProperties: false
                  required: [dates, applyDocuments, atDocument]
                  properties:
                    dates:
                      type: object
                      additionalProperties: false
                      required: [applyStartDate, applyEndDate, documentPublishedAt, finalPublishedAt]
                      properties:
                        applyStartDate:
                          type: string
                          format: date
                          nullable: true
                          description: 신청 시작일 (SH 입력, LH 반드시 null)
                          example: "2026-01-13"
                        applyEndDate:
                          type: string
                          format: date
                          nullable: true
                          description: 신청 마감일 (SH 입력, LH 반드시 null)
                          example: "2026-01-15"
                        documentPublishedAt:
                          type: string
                          format: date
                          nullable: true
                          description: 서류 발표일 (SH/LH 공통. LH는 이 값만 입력)
                          example: "2026-02-01"
                        finalPublishedAt:
                          type: string
                          format: date
                          nullable: true
                          description: 최종 발표일 (SH 입력, LH 반드시 null)
                          example: "2026-02-15"

                    applyDocuments:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        additionalProperties: false
                        required: [name, type]
                        properties:
                          name:
                            type: string
                            minLength: 1
                            description: 서류명
                            example: "주민등록등본"
                          type:
                            type: string
                            enum: [COMMON, TARGET_ONLY]
                            description: 서류 타입
                            example: "COMMON"

                    atDocument:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        additionalProperties: false
                        required: [name, type]
                        properties:
                          name:
                            type: string
                            minLength: 1
                            description: 서류명
                            example: "주민등록등본"
                          type:
                            type: string
                            enum: [COMMON, TARGET_ONLY]
                            description: 서류 타입
                            example: "COMMON"

                overviewSummary:
                  type: object
                  additionalProperties: false
                  required: [overview, summary]
                  properties:
                    overview:
                      type: object
                      additionalProperties: false
                      required: [content, target, regions, applyMethod]
                      properties:
                        content:
                          type: string
                          description: 공고 내용(개요)
                          example: "공고 내용"
                        target:
                          type: string
                          description: 대상
                          example: "만 19~34세 청년"
                        regions:
                          type: array
                          items: { type: string }
                          example: ["강남구", "마포구"]
                        applyMethod:
                          type: string
                          description: 접수 방법
                          example: "온라인 접수"
                    summary:
                      type: string
                      nullable: true
                      description: 공고 요약 단일 문장(어드민 수기). 요약이 없으면 null 저장 가능.
                      example: "서울 강남/마포 대상 청년 임대주택 모집, 온라인 접수."

            examples:
              sh_upsert:
                summary: SH 통합 저장
                value:
                  publisher: SH
                  housingType: "아파트"
                  supplyType: "공공임대"
                  regionCode: "11440"
                  regionName: "서울특별시 마포구"
                  applyUrl: "https://www.i-sh.co.kr/apply/notice/12345"
                  applyEntryUrl: "https://www.i-sh.co.kr/apply/notice/12345"
                  rentGtn: 10000000
                  enty: 1000000
                  prtpay: 3000000
                  surlus: 6000000
                  mtRntchrg: 250000
                  eligibility:
                    answers:
                      - additionalOnboardingId: 900001
                        type: SELECT_SINGLE
                        unknown: false
                        value: "신혼부부"
                        options: ["신혼부부", "생애최초", "청년"]
                  submission:
                    dates:
                      applyStartDate: "2026-01-13"
                      applyEndDate: "2026-01-15"
                      documentPublishedAt: "2026-02-01"
                      finalPublishedAt: "2026-02-15"
                    applyDocuments:
                      - name: "주민등록등본"
                        type: "COMMON"
                    atDocument:
                      - name: "소득금액증명원"
                        type: "COMMON"
                  overviewSummary:
                    overview:
                      content: "공고 내용"
                      target: "만 19~34세 청년"
                      regions: ["마포구", "강남구"]
                      applyMethod: "SH 온라인 접수"
                    summary: "서울 강남/마포 대상 청년 임대주택 모집, SH 온라인 접수."

              lh_upsert:
                summary: LH 통합 저장 (applyEntryUrl만 입력, 나머지는 null)
                value:
                  publisher: LH
                  housingType: null
                  supplyType: null
                  regionCode: null
                  regionName: null
                  applyUrl: null
                  applyEntryUrl: "https://apply.lh.or.kr/"
                  rentGtn: null
                  enty: null
                  prtpay: null
                  surlus: null
                  mtRntchrg: null
                  eligibility:
                    answers:
                      - additionalOnboardingId: 900001
                        type: BOOLEAN
                        unknown: false
                        value: true
                        options: null
                  submission:
                    dates:
                      applyStartDate: null
                      applyEndDate: null
                      documentPublishedAt: "2026-02-01"
                      finalPublishedAt: null
                    applyDocuments:
                      - name: "주민등록등본"
                        type: "COMMON"
                    atDocument:
                      - name: "소득금액증명원"
                        type: "COMMON"
                  overviewSummary:
                    overview:
                      content: "공고 내용"
                      target: "만 19~34세 청년"
                      regions: ["강남구", "마포구"]
                      applyMethod: "LH 온라인 접수"
                    summary: "서울 강남/마포 대상 청년 임대주택 모집, LH 온라인 접수."

      responses:
        "204":
          description: No Content (저장 완료)
        "400":
          description: Validation Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Conflict (publisher 불일치 / 상태 충돌 / 규칙 위반 등)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

              
