openapi: 3.0.3
info:
  title: Youth Policy App API
  version: 0.1.0
  description: '기능 요구사항 기반 초안 OpenAPI입니다. (컴포넌트/refs 미사용) 인증/권한은 별도 securitySchemes
    없이, 필요 엔드포인트에 Authorization 헤더 파라미터로 명시합니다.

    '
servers:
- url: http://localhost:8080
  description: Local
- url: https://api.example.com
  description: Production
tags:
- name: accounts
  description: 계정/인증 (카카오 OAuth2)
- name: announcements
  description: 공고 (홈/상세/자격진단/원문)
- name: mypage
  description: 마이페이지 (체크리스트/캘린더/찜/신청기록)
- name: community
  description: 커뮤니티 (댓글/대댓글/좋아요/신고)
- name: gamification
  description: 게이미피케이션 (미션/배지)
- name: policies
  description: 정책 (청년정책 지원)
- name: admin
  description: 관리자 기능 (공고/정책 관리)
- name: chat
  description: 채팅 봇
paths:
  /api/auth/kakao:
    get:
      tags:
      - accounts
      summary: 카카오 로그인 시작 (백엔드가 전체 OAuth 처리, JWT는 쿠키로만)
      description: '프론트는 이 URL로 이동만 하면 됩니다. 이후 인가/콜백/토큰교환/회원처리 전부 백엔드에서 처리합니다.

        로그인 성공 시 JWT를 HttpOnly 쿠키로 설정(Set-Cookie)하고, 백엔드가 "/"로 리다이렉션(Location: /)합니다.

        userId는 ULID를 사용합니다.

        '
      operationId: accounts_authKakao
      responses:
        '302':
          description: Redirect (성공 시 Set-Cookie 포함, Location은 "/")
          headers:
            Location:
              schema:
                type: string
              description: 로그인 성공 시 "/"
            Set-Cookie:
              schema:
                type: string
              description: JWT 쿠키(HttpOnly; Secure; SameSite 등 백엔드 정책)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /api/auth/logout:
    post:
      tags:
      - accounts
      summary: 로그아웃
      description: 'JWT는 HttpOnly 쿠키로 관리됩니다. 이 엔드포인트는 인증 쿠키를 만료(Set-Cookie)시켜 로그아웃
        처리합니다. (userId는 ULID를 사용)

        '
      operationId: accounts_logout
      responses:
        '204':
          description: No Content (인증 쿠키 만료)
          headers:
            Set-Cookie:
              schema:
                type: string
              description: '인증 쿠키를 만료시키는 Set-Cookie. (예: access=; Max-Age=0; Path=/;
                HttpOnly; Secure; SameSite=... )

                '
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/announcements/personalized:
    get:
      tags:
      - announcements
      summary: 맞춤 공고 목록 조회
      description: '온보딩 완료 사용자 전용 맞춤 공고 목록입니다. 인증은 HttpOnly 쿠키(JWT)로 처리됩니다. userId는
        ULID를 사용합니다. 비로그인(쿠키 없음/만료)이면 401, 온보딩 미완료면 403을 반환합니다.

        '
      operationId: announcements_getPersonalizedAnnouncements
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          nullable: true
        description: 다음 페이지 조회를 위한 커서. 최초 조회 시 생략
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: 페이지 크기
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - RELEVANCE
          - LATEST
          - DEADLINE
          default: RELEVANCE
        description: '정렬 기준

          - RELEVANCE: 적합순(기본값)

          - LATEST: 최신순

          - DEADLINE: 마감임박순

          '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    description: 맞춤 공고 목록
                    items:
                      type: object
                      required:
                      - announcementId
                      - title
                      - startDate
                      - endDate
                      - publishedAt
                      - publisher
                      - status
                      properties:
                        announcementId:
                          type: integer
                          format: int64
                          description: 공고 PK
                          example: 12345
                        title:
                          type: string
                          description: 공고명
                          example: OO시 반값 중개보수 지원사업
                        housingType:
                          type: string
                          description: 주택 유형(앱 뱃지/필터에 사용)
                          example: 행복주택
                        startDate:
                          type: string
                          format: date
                          description: 공고 시작일
                          example: '2025-12-01'
                        endDate:
                          type: string
                          format: date
                          description: 공고 마감일
                          example: '2026-01-15'
                        publishedAt:
                          type: string
                          format: date
                          description: 발표일(게시일)
                          example: '2025-12-30'
                        publisher:
                          type: string
                          description: 발행처(기관/지자체 등)
                          example: LH 한국토지주택공사
                        status:
                          type: string
                          description: 공고 접수 상태(앱 뱃지에 사용)
                          enum:
                          - OPEN
                          - DUE_SOON
                          - UPCOMING
                          - CLOSED
                          example: DUE_SOON
                  meta:
                    type: object
                    required:
                    - limit
                    - hasNext
                    - nextCursor
                    properties:
                      limit:
                        type: integer
                        minimum: 1
                        maximum: 100
                        example: 20
                        description: 페이지 크기
                      hasNext:
                        type: boolean
                        example: true
                        description: 다음 페이지 존재 여부
                      nextCursor:
                        type: string
                        nullable: true
                        example: "cursor_abcdef"
                        description: 다음 페이지 조회를 위한 커서(없으면 null)
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    data:
                    - announcementId: 900001
                      title: Mock title 1
                      housingType: 행복주택
                      startDate: '2026-01-01'
                      endDate: '2026-01-01'
                      publishedAt: '2026-01-01'
                      publisher: LH 한국토지주택공사
                      status: OPEN
                    - announcementId: 900001
                      title: Mock title 1
                      housingType: 행복주택
                      startDate: '2026-01-01'
                      endDate: '2026-01-01'
                      publishedAt: '2026-01-01'
                      publisher: LH 한국토지주택공사
                      status: OPEN
                    meta:
                      limit: 20
                      hasNext: true
                      nextCursor: "cursor_mock1"
                mock2:
                  summary: Scenario 2
                  value:
                    data:
                    - announcementId: 900002
                      title: Mock title 2
                      housingType: 안심주택
                      startDate: '2026-01-02'
                      endDate: '2026-01-02'
                      publishedAt: '2026-01-02'
                      publisher: LH 한국토지주택공사
                      status: DUE_SOON
                    - announcementId: 900002
                      title: Mock title 2
                      housingType: 안심주택
                      startDate: '2026-01-02'
                      endDate: '2026-01-02'
                      publishedAt: '2026-01-02'
                      publisher: LH 한국토지주택공사
                      status: DUE_SOON
                    meta:
                      limit: 20
                      hasNext: true
                      nextCursor: "cursor_mock2"
                mock3:
                  summary: Scenario 3
                  value:
                    data:
                    - announcementId: 900003
                      title: Mock title 3
                      housingType: 장기전세
                      startDate: '2026-01-03'
                      endDate: '2026-01-03'
                      publishedAt: '2026-01-03'
                      publisher: LH 한국토지주택공사
                      status: UPCOMING
                    - announcementId: 900003
                      title: Mock title 3
                      housingType: 장기전세
                      startDate: '2026-01-03'
                      endDate: '2026-01-03'
                      publishedAt: '2026-01-03'
                      publisher: LH 한국토지주택공사
                      status: UPCOMING
                    meta:
                      limit: 20
                      hasNext: true
                      nextCursor: "cursor_mock3"
                mock4:
                  summary: Scenario 4
                  value:
                    data:
                    - announcementId: 900004
                      title: Mock title 4
                      housingType: 행복주택
                      startDate: '2026-01-04'
                      endDate: '2026-01-04'
                      publishedAt: '2026-01-04'
                      publisher: LH 한국토지주택공사
                      status: CLOSED
                    - announcementId: 900004
                      title: Mock title 4
                      housingType: 행복주택
                      startDate: '2026-01-04'
                      endDate: '2026-01-04'
                      publishedAt: '2026-01-04'
                      publisher: LH 한국토지주택공사
                      status: CLOSED
                    meta:
                      limit: 20
                      hasNext: true
                      nextCursor: "cursor_mock4"
                mock5:
                  summary: Scenario 5
                  value:
                    data:
                    - announcementId: 900005
                      title: Mock title 5
                      housingType: 안심주택
                      startDate: '2026-01-05'
                      endDate: '2026-01-05'
                      publishedAt: '2026-01-05'
                      publisher: LH 한국토지주택공사
                      status: OPEN
                    - announcementId: 900005
                      title: Mock title 5
                      housingType: 안심주택
                      startDate: '2026-01-05'
                      endDate: '2026-01-05'
                      publishedAt: '2026-01-05'
                      publisher: LH 한국토지주택공사
                      status: OPEN
                    meta:
                      limit: 20
                      hasNext: true
                      nextCursor: "cursor_mock5"
        '401':
          description: Unauthorized (비로그인/토큰 만료)
          content:
