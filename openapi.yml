                        endDate:
                          type: string
                          format: date
                          description: 마감일(YYYY-MM-DD)
                          example: '2026-01-15'
                        publishedAt:
                          type: string
                          format: date
                          description: 게시일(YYYY-MM-DD)
                          example: '2026-01-01'
                        publisher:
                          type: string
                          description: 발행처(기관/부서명 등)
