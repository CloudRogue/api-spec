  /api/mypage/notification-settings/reminder-settings:
    get:
      tags:
      - mypage
      summary: 리마인더 설정 조회
      description: '마감일 리마인더(예: D-1, D-Day)를 어떤 채널로, 몇 시에 보낼지에 대한 사용자 설정을 조회합니다. (공고별
        설정은 지원하지 않음)

        enabled=false인 경우 리마인더를 발송하지 않습니다. sendAtHour는 0~23시(로컬 기준)입니다. JWT는 HttpOnly
        쿠키로 인증됩니다. userId는 ULID를 사용합니다.

        '
      operationId: mypage_getReminderSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                - sendAtHour
                - daysBefore
                properties:
                  enabled:
                    type: boolean
                    description: sendAtHour가 null이면 false, 아니면 true
                    example: true
                  sendAtHour:
                    type: integer
                    minimum: 0
                    maximum: 23
                    nullable: true
                    example: 9
                  daysBefore:
                    type: integer
                    minimum: 0
                    maximum: 365
                    nullable: true
                    example: 1
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    enabled: false
                    sendAtHour: null
                    daysBefore: null
                mock2:
                  summary: Scenario 2
                  value:
                    enabled: true
                    sendAtHour: 14
                    daysBefore: 1
                mock3:
                  summary: Scenario 3
                  value:
                    enabled: false
                    sendAtHour: null
                    daysBefore: null
                mock4:
                  summary: Scenario 4
                  value:
                    enabled: true
                    sendAtHour: 4
                    daysBefore: 3
                mock5:
                  summary: Scenario 5
                  value:
                    enabled: false
                    sendAtHour: null
                    daysBefore: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
      - mypage
      summary: 리마인더 설정 저장
      description: '마감일 리마인더 설정을 저장(전체 덮어쓰기)합니다. (공고별 설정은 지원하지 않음)

        sendAtHour는 0~23시(로컬 기준)입니다. JWT는 HttpOnly 쿠키로 인증됩니다. userId는 ULID를 사용합니다.
        sendAtHour 및 daysBefore 중 하나라도 Null 이면 enabled=false로 간주됩니다.

        '
      operationId: mypage_putReminderSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sendAtHour:
                  type: integer
                  minimum: 0
                  maximum: 23
                  example: 9
                daysBefore:
                  type: integer
                  minimum: 0
                  maximum: 365
                  example: 1
      responses:
        '204':
          description: No Content (저장 완료)
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (알림 채널 비활성화)
          content:
            application/json:
              schema:
                type: object
                required: [code, message, status, details]
                properties:
                  code: { type: string }
                  message: { type: string }
                  status: { type: integer }
                  details:
                    type: object
                    required: [field, reason]
                    properties:
                      field: { type: string }
                      reason: { type: string }
              examples:
                notificationChannelDisabled:
                  value:
                    code: NOTIFICATION_CHANNEL_DISABLED
                    message: 알림 채널(이메일/카카오)이 모두 비활성화되어 리마인더를 설정할 수 없습니다.
                    status: 409
                    details:
                      field: channels
                      reason: 이메일/카카오 중 최소 1개는 활성화되어야 합니다.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  
