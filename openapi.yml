  /api/todos:
    get:
      tags:
      - todo
      summary: 나의 Todo 목록 조회
      description: 유저가 생성/보유한 Todo 목록을 페이지 기반으로 조회합니다.
      operationId: todo_listTodos
      parameters:
      - name: status
        in: query
        required: false
        description: Todo 상태 필터(ACTIVE/COMPLETED)
        schema:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          default: ACTIVE
          example: ACTIVE
      - name: announcementId
        in: query
        required: false
        description: 특정 공고의 Todo만 조회할 때 사용하는 공고 ID
        schema:
          type: string
          example: ann_LH_20251229_000123
      - name: page
        in: query
        required: false
        description: 0부터 시작하는 페이지 번호
        schema:
          type: integer
          default: 0
          minimum: 0
          example: 0
      - name: size
        in: query
        required: false
        description: 페이지 크기
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
          example: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Todo 목록 응답
                required:
                - items
