                        description: 다음 페이지 존재 여부
                      nextCursor:
                        type: string
                        nullable: true
                        example: "cursor_abcdef"
                        description: 다음 페이지 조회를 위한 커서(없으면 null)
        '401':
          description: Unauthorized (비로그인/토큰 만료)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (온보딩 미완료)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
