  /api/mypage/reminder-settings:
    get:
      tags:
      - mypage
      summary: 리마인더 설정 조회
      description: '마감일 리마인더(예: D-1, D-Day)를 어떤 채널로, 몇 시에 보낼지에 대한 사용자 설정을 조회합니다. (공고별
        설정은 지원하지 않음)

        enabled=false인 경우 리마인더를 발송하지 않습니다. sendAtHour는 0~23시(로컬 기준)입니다. JWT는 HttpOnly
        쿠키로 인증됩니다. userId는 ULID를 사용합니다.

        '
      operationId: mypage_getReminderSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                - sendAtHour
                - daysBefore
                properties:
                  enabled:
                    type: boolean
                    description: sendAtHour가 null이면 false, 아니면 true
                    example: true
                  sendAtHour:
                    type: integer
                    minimum: 0
                    maximum: 23
                    nullable: true
                    example: 9
                  daysBefore:
                    type: integer
                    minimum: 0
                    maximum: 365
                    nullable: true
                    example: 1
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    enabled: false
                    sendAtHour: null
                    daysBefore: null
                mock2:
                  summary: Scenario 2
                  value:
                    enabled: true
                    sendAtHour: 14
                    daysBefore: 1
                mock3:
                  summary: Scenario 3
                  value:
                    enabled: false
                    sendAtHour: null
                    daysBefore: null
                mock4:
                  summary: Scenario 4
                  value:
                    enabled: true
                    sendAtHour: 4
                    daysBefore: 3
                mock5:
                  summary: Scenario 5
                  value:
                    enabled: false
                    sendAtHour: null
                    daysBefore: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
      - mypage
      summary: 리마인더 설정 저장
      description: '마감일 리마인더 설정을 저장(전체 덮어쓰기)합니다. (공고별 설정은 지원하지 않음)

        sendAtHour는 0~23시(로컬 기준)입니다. JWT는 HttpOnly 쿠키로 인증됩니다. userId는 ULID를 사용합니다.

        '
      operationId: mypage_putReminderSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sendAtHour:
                  type: integer
                  minimum: 0
                  maximum: 23
                  example: 9
                daysBefore:
                  type: integer
                  minimum: 0
                  maximum: 365
                  example: 1
      responses:
        '204':
          description: No Content (저장 완료)
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (알림 채널 비활성화)
          content:
            application/json:
              schema:
                type: object
                required: [code, message, status, details]
                properties:
                  code: { type: string }
                  message: { type: string }
                  status: { type: integer }
                  details:
                    type: object
                    required: [field, reason]
                    properties:
                      field: { type: string }
                      reason: { type: string }
              examples:
                notificationChannelDisabled:
                  value:
                    code: NOTIFICATION_CHANNEL_DISABLED
                    message: 알림 채널(이메일/카카오)이 모두 비활성화되어 리마인더를 설정할 수 없습니다.
                    status: 409
                    details:
                      field: channels
                      reason: 이메일/카카오 중 최소 1개는 활성화되어야 합니다.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'






  /api/community/announcements/{announcementId}/comments:
    get:
      tags:
      - community
      summary: 공고별 댓글 목록 조회(질문/답변 구조)
      description: 공고 상세 하단의 Q/A 댓글을 페이지 기반으로 조회합니다. 비속어/개인정보/스팸/성적 표현은 마스킹(*) 처리될
        수 있습니다.
      operationId: community_listComments
      parameters:
      - name: announcementId
        in: path
        required: true
        description: 댓글을 조회할 공고 ID
        schema:
          type: string
          example: ann_LH_20251229_000123
      - name: page
        in: query
        required: false
        description: 0부터 시작하는 페이지 번호
        schema:
          type: integer
          default: 0
          minimum: 0
          example: 0
      - name: size
        in: query
        required: false
        description: 페이지 크기
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
          example: 20
      - name: sort
        in: query
        required: false
        description: '정렬 기준(기본: 최신순)'
        schema:
          type: string
          default: LATEST
          enum:
          - LATEST
          - POPULAR
          example: LATEST
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 댓글 목록 응답
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    description: 댓글 목록(parentId=0이면 질문, parentId>0이면 답변)
                    items:
                      type: object
                      description: 댓글 단건
                      required:
                      - id
                      - announcementId
                      - parentId
                      - kind
                      - content
                      - contentFilter
                      - likeCount
                      - reportCount
                      - deleted
                      - createdAt
                      - updatedAt
                      - author
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: 댓글 PK
                          example: 101
                        announcementId:
                          type: string
                          description: 공고 ID
                          example: ann_LH_20251229_000123
                        parentId:
                          type: integer
                          format: int64
                          description: 부모 댓글 PK(없으면 0, 답변이면 질문 댓글 PK)
                          example: 0
                        kind:
                          type: string
                          description: 댓글 유형(질문/답변)
                          enum:
                          - QUESTION
                          - ANSWER
                          example: QUESTION
                        content:
                          type: string
                          description: 댓글 내용(필터링 대상은 마스킹(*) 처리, 소프트삭제면 '삭제된 댓글입니다.'로
                            내려갈 수 있음)
                          example: 이 공고는 **** 기준이 어떻게 되나요?
                        contentFilter:
                          type: string
                          description: 콘텐츠 필터링 상태
                          enum:
                          - NONE
                          - PROFANITY
                          - SEXUAL
                          - PERSONAL_INFO
                          - SPAM
                          example: PROFANITY
                        likeCount:
                          type: integer
                          description: 좋아요 수
                          example: 7
                        reportCount:
                          type: integer
                          description: 누적 신고 수
                          example: 2
                        deleted:
                          type: boolean
                          description: '소프트 삭제 여부(예: 신고 3회 누적 시 true)'
                          example: false
                        deletedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 삭제 시각(삭제되지 않았다면 null)
                          example: null
                        createdAt:
                          type: string
