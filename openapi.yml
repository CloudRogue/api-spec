                        status:
                          type: string
                          description: 공고 상태
                          enum: [OPEN, DUE_SOON, UPCOMING, CLOSED]
                          example: OPEN
                  nextCursor:
                    type: integer
                    format: int64
                    nullable: true
                    description: 다음 페이지 조회에 사용할 커서(더 이상 없으면 null)
                    example: 899990
                  hasNext:
                    type: boolean
                    description: 다음 페이지 존재 여부
                    example: true
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    items:
                      - announcementId: 900001
                        title: "Mock title 1"
                        housingType: "행복주택"
                        startDate: "2026-01-01"
                        endDate: "2026-01-15"
