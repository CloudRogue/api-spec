                        endDate:
                          type: string
                          format: date
                          description: 공고 마감일
                          example: "2026-01-15"
                        publishedAt:
                          type: string
                          format: date
                          description: 발표일(게시일)
                          example: "2025-12-30"
                        publisher:
                          type: string
                          description: 발행처(기관/지자체 등)
                          example: LH 한국토지주택공사
                        status:
                          type: string
                          description: 공고 접수 상태(앱 뱃지에 사용)
                          enum: [OPEN, DUE_SOON, UPCOMING, CLOSED]
                          example: DUE_SOON
                  meta:
                    type: object
                    required: [limit, hasNext, nextCursor]
                    properties:
                      limit:
                        type: integer
                        minimum: 1
