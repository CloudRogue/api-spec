      description: 질문은 parentId=0, 답변은 parentId에 질문 댓글 PK를 넣어 작성합니다. 필터링 대상은 저장/노출
        정책에 따라 마스킹(*) 처리될 수 있습니다.
      operationId: community_createComment
      parameters:
      - name: announcementId
        in: path
        required: true
        description: 댓글을 작성할 공고 ID
        schema:
          type: string
          example: ann_LH_20251229_000123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 댓글 작성 요청
              required:
              - parentId
              - content
              properties:
                parentId:
                  type: integer
                  format: int64
                  description: 부모 댓글 PK(질문은 0, 답변은 질문 댓글 PK)
                  example: 0
                content:
                  type: string
                  description: 댓글 내용(서버 정책으로 길이/비속어/개인정보/스팸/성적표현 필터링 적용)
                  example: 원문 기준으로는 소득 기준이 어떻게 되나요?
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: 댓글 생성 응답
                required:
                - id
                properties:
                  id:
                    type: integer
                    format: int64
                    description: 생성된 댓글 PK
                    example: 123
