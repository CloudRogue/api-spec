  /api/admin/announcements/{announcementId}:
    get:
      tags: [admin, announcements]
      summary: (어드민) 공고 AI PDF 요약/추출 결과 조회(참고용, KV 리스트)
      description: >
        공고(announcementId)에 대해 AI가 PDF를 읽고 요약한 결과를 조회합니다.
        이 API는 정확성을 보장하지 않으며 참고용입니다.

        응답은 "kvDigest" 형태의 **key/value 쌍 리스트**로 내려갑니다.
        value는 문자열만 허용합니다(중첩 object/배열 금지).

        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: admin_getAnnouncementAiDigest
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 12345
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [provider, title, contentText, kvDigest]
                properties:
                  provider:
                    type: string
                    enum: [LH, SH]
                    description: 공고 기관(추출값)
                    example: LH
                  title:
                    type: string
                    description: 공고명(추출값)
                    example: 청년매입임대주택 모집 공고
                  publisher:
                    type: string
                    nullable: true
                    description: 발행처(추출값)
                    example: LH 한국토지주택공사
                  startDate:
                    type: string
                    format: date
                    nullable: true
                    description: 공고 시작일(추출값, 없을 수 있음)
                    example: "2025-12-01"
                  endDate:
                    type: string
                    format: date
                    nullable: true
                    description: 공고 마감일(추출값, 없을 수 있음)
                    example: "2026-01-15"
                  contentText:
                    type: string
                    description: 원문/가공 본문(추출값)
                    example: 본 공고는 ... (중략)
                  kvDigest:
                    type: array
                    description: >
                      AI가 PDF에서 뽑아낸 요약 결과(KV 리스트).
                      value는 문자열만 허용(중첩 구조 금지).
                    items:
                      type: object
                      required: [key, value]
                      additionalProperties: false
                      properties:
                        key:
                          type: string
                          description: 항목명
                          example: 청약 기간
                        value:
                          type: string
                          description: 항목 요약 텍스트
                          example: 2년간 꾸준히 납입하면 우선순위
                    example:
                      - key: 청약 기간
                        value: 2년간 꾸준히 납입하면 우선순위
                      - key: 납입 인정 기준
                        value: 월 10만원 이상 납입 시 인정
                      - key: 유의사항
                        value: 서류 미제출 시 자동 탈락
                  originalUrl:
                    type: string
                    format: uri
                    nullable: true
                    description: 원문 링크(추출값)
                    example: https://example.com/notice/123
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not Found (해당 공고의 AI 요약/추출 데이터가 없음)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    put:
      tags: [admin, announcements]
      summary: (어드민) 공고 요약(KV 리스트) + 지원자격(정규화) 수기 확정 저장
      description: >
        어드민이 PDF를 직접 읽고 정리한 "kvDigest"(KV 리스트)와
        "eligibility"(정규화 지원자격)를 저장합니다.

        kvDigest의 value는 문자열만 허용(중첩 구조 금지).
        eligibility는 없는 항목은 null로 보낼 수 있습니다.
      operationId: admin_upsertAnnouncementEligibility
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK(사전 발급된 ID)
          example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kvDigest, eligibility]
              properties:
                kvDigest:
                  type: array
                  description: 어드민이 수기로 작성한 PDF 요약(KV 리스트). value는 문자열만 허용.
                  items:
                    type: object
                    required: [key, value]
                    additionalProperties: false
                    properties:
                      key:
                        type: string
                        example: 청약 기간
                      value:
                        type: string
                        example: 2년간 꾸준히 납입하면 우선순위
                  example:
                    - key: 청약 기간
                      value: 2년간 꾸준히 납입하면 우선순위
                    - key: 납입 인정 기준
                      value: 월 10만원 이상 납입 시 인정

                eligibility:
                  type: object
                  description: 지원 자격(정규화) - DB 필터링/매칭 가능한 구조
                  nullable: true
                  properties:
                    age:
                      type: object
                      nullable: true
                      properties:
                        min: { type: integer, nullable: true, minimum: 0, example: 19 }
                        max: { type: integer, nullable: true, minimum: 0, example: 34 }
                        displayText: { type: string, nullable: true, example: "만 19~34세" }

                    region:
                      type: object
                      nullable: true
                      description: >
                        거주지역 요건(정규화) - MVP: 동(DONG) 단위로 고정
                        - codes: 동(읍/면/동) 코드 목록
                        - ruleType: 포함/제외 규칙
                      properties:
                        ruleType:
                          type: string
                          nullable: true
                          enum: [INCLUDE, EXCLUDE]
                          example: INCLUDE
                        codes:
                          type: array
                          nullable: true
                          items: { type: string }
                          example: ["11"]
                        displayText:
                          type: string
                          nullable: true
                          example: "서울특별시 거주"

                    income:
                      type: object
                      nullable: true
                      description: 소득 요건(정규화)
                      properties:
                        metric:
                          type: string
                          nullable: true
                          enum: [MEDIAN_INCOME_PERCENT, INCOME_DECILE, HEALTH_INSURANCE_PREMIUM]
                          example: MEDIAN_INCOME_PERCENT
                        operator:
                          type: string
                          nullable: true
                          enum: [LTE, LT, GTE, GT, EQ, BETWEEN]
                          example: LTE
                        value:
                          type: number
                          nullable: true
                          example: 150
                        value2:
                          type: number
                          nullable: true
                          example: 200
                        householdSizeMin:
                          type: integer
                          nullable: true
                          minimum: 1
                          example: 1
                        householdSizeMax:
                          type: integer
                          nullable: true
                          minimum: 1
                          example: 3
                        displayText:
                          type: string
                          nullable: true
                          example: "중위소득 150% 이하"

                    subscriptionAccount:
                      type: object
                      nullable: true
                      description: 청약통장/납입 요건(정규화)
                      properties:
                        가입기간MonthsMin:
                          type: integer
                          nullable: true
                          minimum: 0
                          example: 12
                        납입횟수Min:
                          type: integer
                          nullable: true
                          minimum: 0
                          example: 24
                        displayText:
                          type: string
                          nullable: true
                          example: "가입 12개월 이상, 납입 24회 이상"

                    notes:
                      type: string
                      nullable: true
                      example: 일부 유형은 신혼부부 우선

                originalUrl:
                  type: string
                  format: uri
                  nullable: true
                  description: 원문 링크(선택)
                  example: https://example.com/notice/123
      responses:
        "204":
          description: No Content (저장 완료)
        "400":
          description: Validation Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Conflict (SH 공고는 /sh API를 사용)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/admin/announcements/{announcementId}/sh:
    put:
      tags: [admin, announcements]
      summary: (어드민) SH 공고 전용 - 공통(KV/지원자격) + SH 상세 필드 수기 확정 저장
      description: >
        SH 공고일 때만 사용하는 저장 API입니다.
        공통 필드(kvDigest, eligibility, originalUrl) + SH 상세 필드(dDay, 임대료, 주소 등)를 한 번에 저장합니다.
      operationId: admin_upsertShAnnouncement
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                # (A) 오리지널 PUT 바디(공통 저장)
                - type: object
                  required: [publisher, kvDigest, eligibility]
                  properties:
                    publisher:
                      type: string
                      enum: [SH]
                      description: SH 고정
                      example: SH

                    kvDigest:
                      type: array
                      description: 어드민이 수기로 작성한 PDF 요약(KV 리스트). value는 문자열만 허용.
                      items:
                        type: object
                        required: [key, value]
                        additionalProperties: false
                        properties:
                          key: { type: string, example: 청약 기간 }
                          value: { type: string, example: 2년간 꾸준히 납입하면 우선순위 }

                    eligibility:
                      type: object
                      nullable: true
                      minProperties: 1
                      description: >
                        지원 조건(정규화) - 없는 항목은 null.
                        공고에 조건 정보가 전혀 없으면 eligibility 자체가 null일 수 있습니다.
                        (빈 객체 {} 는 허용하지 않습니다)
                      properties:
                        age:
                          type: object
                          nullable: true
                          description: 나이 요건(없으면 null)
                          properties:
                            min: { type: integer, nullable: true, minimum: 0, example: 19 }
                            max: { type: integer, nullable: true, minimum: 0, example: 34 }
                            displayText: { type: string, nullable: true, example: "만 19~34세" }

                        region:
                          type: object
                          nullable: true
                          description: 거주지역 요건(정규화, 없으면 null)
                          properties:
                            ruleType:
                              type: string
                              nullable: true
                              enum: [INCLUDE, EXCLUDE]
                              description: >
                                codes 적용 방식
                                - INCLUDE: codes에 포함된 지역만 허용
                                - EXCLUDE: codes에 포함된 지역은 제외
                              example: INCLUDE
                            codes:
                              type: array
                              nullable: true
                              items: { type: string }
                              description: 대상 지역 코드 목록
                              example: ["11"]
                            displayText:
                              type: string
                              nullable: true
                              description: 화면 표기용(원문 요약)
                              example: "서울특별시 거주"

                        income:
                          type: object
                          nullable: true
                          description: 소득 요건(정규화, 없으면 null)
                          properties:
                            metric:
                              type: string
                              nullable: true
                              enum: [MEDIAN_INCOME_PERCENT, INCOME_DECILE, HEALTH_INSURANCE_PREMIUM]
                              description: >
                                값 해석 기준(단위/의미)
                                - MEDIAN_INCOME_PERCENT: 중위소득 퍼센트(예: 150 = 150%)
                                - INCOME_DECILE: 소득 분위(예: 3 = 3분위)
                                - HEALTH_INSURANCE_PREMIUM: 건강보험료(원, 월 기준)
                              example: MEDIAN_INCOME_PERCENT
                            operator:
                              type: string
                              nullable: true
                              enum: [LTE, LT, GTE, GT, EQ, BETWEEN]
                              description: >
                                비교 연산자
                                - LTE/LT/GTE/GT/EQ: value 단일 기준
                                - BETWEEN: value(하한) ~ value2(상한) 범위
                              example: LTE
                            value:
                              type: number
                              nullable: true
                              description: 기준값(metric에 따라 단위 상이)
                              example: 150
                            value2:
                              type: number
                              nullable: true
                              description: operator=BETWEEN일 때 상한값
                              example: 200
                            householdSizeMin:
                              type: integer
                              nullable: true
                              minimum: 1
                              example: 1
                            householdSizeMax:
                              type: integer
                              nullable: true
                              minimum: 1
                              example: 3
                            displayText:
                              type: string
                              nullable: true
                              example: "중위소득 150% 이하"

                        subscriptionAccount:
                          type: object
                          nullable: true
                          description: 청약통장 요건(정규화, 없으면 null)
                          properties:
                            가입기간MonthsMin:
                              type: integer
                              nullable: true
                              minimum: 0
                              description: 청약통장 가입기간 최소(개월)
                              example: 12
                            납입횟수Min:
                              type: integer
                              nullable: true
                              minimum: 0
                              description: 청약통장 납입 횟수 최소
                              example: 24
                            displayText:
                              type: string
                              nullable: true
                              description: 화면 표기용(원문 요약)
                              example: "가입 12개월 이상, 납입 24회 이상"

                        notes:
                          type: string
                          nullable: true
                          description: 예외/특기사항(정규화가 어려운 내용만)
                          example: "일부 유형은 신혼부부 우선"

                    originalUrl:
                      type: string
                      format: uri
                      nullable: true
                      description: 원문 링크(선택)
                      example: https://example.com/notice/123

                # (B) SH 추가 바디(상세 필드)
                - type: object
                  required:
                    - title
                    - housingType
                    - startDate
                    - endDate
                    - publishedAt
                    - status
                    - externalApplyUrl
                  properties:
                    title: { type: string, example: "Mock title 1" }
                    housingType: { type: string, example: "행복주택" }
                    startDate: { type: string, format: date, example: "2026-01-01" }
                    endDate: { type: string, format: date, example: "2026-01-01" }
                    publishedAt: { type: string, format: date, example: "2026-01-01" }
                    status:
                      type: string
                      enum: [OPEN, DUE_SOON, UPCOMING, CLOSED]
                      example: OPEN
                    externalApplyUrl:
                      type: string
                      format: uri
                      example: "https://example.com/1"

                    dDay: { type: integer, nullable: true, example: 7 }
                    rentGtn: { type: number, nullable: true, example: 5000000 }
                    enty: { type: number, nullable: true, example: 500000 }
                    prtpay: { type: number, nullable: true, example: 1000000 }
                    surlus: { type: number, nullable: true, example: 3500000 }
                    mtRntchrg: { type: number, nullable: true, example: 250000 }
                    fullAdres: { type: string, nullable: true, example: "서울특별시 강남구 ..." }
                    rnCodeNm: { type: string, nullable: true, example: "테헤란로" }
                    refrnLegaldongNm: { type: string, nullable: true, example: "역삼동" }
                    url:
                      type: string
                      format: uri
                      nullable: true
                      description: 모집공고 URL
                      example: "https://example.com/1"
      responses:
        "204":
          description: No Content (저장 완료)
        "400":
          description: Validation Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Conflict (SH 공고가 아님 / 상태 충돌 등)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/regions/cities:
    get:
      tags:
        - regions
      summary: 시(시도) 목록 조회
      description: >
        대한민국 시(시도/광역) 목록을 반환합니다.
  
      operationId: regions_getCities
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              schema: { type: string }
              example: "public, max-age=86400"
            ETag:
              schema: { type: string }
              example: "\"regions-cities-v1\""
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    description: 시(시도/광역) 목록
                    items:
                      type: object
                      required:
                        - cityCode
                        - cityName
                      properties:
                        cityCode:
                          type: string
                          description: 시(시도) 코드(2자리)
                          pattern: "^[0-9]{2}$"
                          example: "11"
                        cityName:
                          type: string
                          description: 시(시도) 명칭
                          example: "서울특별시"
                  meta:
                    type: object
                    required:
                      - version
                      - totalElements
                    properties:
                      version:
                        type: string
                        description: 지역 데이터 버전(변경 감지용)
                        example: "2026-01-07"
                      totalElements:
                        type: integer
                        minimum: 0
                        example: 17
                        description: 전체 항목 수
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    data:
                      - cityCode: "11"
                        cityName: "서울특별시"
                      - cityCode: "26"
                        cityName: "부산광역시"
                    meta:
                      version: "2026-01-07"
                      totalElements: 17
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/regions/sigungu:
    get:
      tags:
        - regions
      summary: 시군구 목록 조회 (시 코드 기준)
      description: >
        시(시도) 코드(cityCode)에 해당하는 시군구 목록을 반환합니다.
    
      operationId: regions_getSigunguByCityCode
      parameters:
        - name: cityCode
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{2}$"
          description: 시(시도) 코드(2자리). 예) 서울=11
          example: "11"
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              schema: { type: string }
              example: "public, max-age=86400"
            ETag:
              schema: { type: string }
              example: "\"regions-sigungu-11-v1\""
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    description: 시군구 목록
                    items:
                      type: object
                      required:
                        - sigunguCode
                        - sigunguName
                      properties:
                        sigunguCode:
                          type: string
                          description: 시군구 코드(5자리)
                          pattern: "^[0-9]{5}$"
                          example: "11140"
                        sigunguName:
                          type: string
                          description: 시군구 명칭
                          example: "마포구"
                  meta:
                    type: object
                    required:
                      - cityCode
                      - version
                      - totalElements
                    properties:
                      cityCode:
                        type: string
                        description: 요청한 시(시도) 코드
                        example: "11"
                      version:
                        type: string
                        description: 지역 데이터 버전(변경 감지용)
                        example: "2026-01-07"
                      totalElements:
                        type: integer
                        minimum: 0
                        example: 25
                        description: 전체 항목 수
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    data:
                      - sigunguCode: "11110"
                        sigunguName: "종로구"
                      - sigunguCode: "11140"
                        sigunguName: "마포구"
                    meta:
                      cityCode: "11"
                      version: "2026-01-07"
                      totalElements: 25
        "400":
          description: Bad Request (cityCode 형식 오류 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      $ref: ./components/schemas/common.yml#/ErrorResponse
    PageMeta:
      $ref: ./components/schemas/common.yml#/PageMeta
