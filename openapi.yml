                  onboardingCompleted:
                    type: boolean
                    description: 필수 온보딩 완료 여부
                    example: true
              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    name: 홍길동
                    email: gildong@example.com
                    onboardingCompleted: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mypage/profile/detail:
    get:
      tags: [mypage]
      summary: 맞춤 프로필 상세 조회
      description: >
        맞춤 추천/자격 판단에 필요한 프로필 상세정보를 조회합니다.

        - 응답은 "필수 온보딩(requiredOnboardingAnswers)"과 "추가 온보딩(additionalOnboardingAnswers)" 2개 리스트로 구성됩니다.
        - 두 리스트의 아이템 스키마는 동일합니다: { id, title, type, options, value }
        - ✅ requiredOnboardingAnswers / additionalOnboardingAnswers 모두 id는 동일하게 additionalOnboardingId(int64) PK를 사용합니다.
          (백엔드에서 "필수/추가"를 분기하여 각 리스트로 내려줍니다.)
        - options 규칙
          - type이 SELECT_SINGLE/SELECT_MULTI인 경우: 배열(빈 배열 금지)
          - 그 외 type인 경우: 반드시 null
        - value 타입 규칙
          - BOOLEAN: boolean
          - TEXT_INPUT: string
          - NUMBER_INPUT: number
          - SELECT_SINGLE: string
          - SELECT_MULTI: string[]
          - DATE: string(date)
      operationId: mypage_getProfileDetail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [requiredOnboardingAnswers, additionalOnboardingAnswers]
                properties:
                  requiredOnboardingAnswers:
                    type: array
                    description: 필수 온보딩(프로필 기본 항목) 응답 리스트
                    items: &OnboardingAnswer
                      type: object
                      additionalProperties: false
                      required: [id, title, type, options, value]
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: additionalOnboardingId (필수/추가 공통 PK)
                          example: 900001
                        title:
                          type: string
                          description: 화면 표시 제목(질문 title)
                          example: 성별
                        type:
                          type: string
                          description: value 타입
                          enum: [BOOLEAN, TEXT_INPUT, NUMBER_INPUT, SELECT_SINGLE, SELECT_MULTI, DATE]
                          example: SELECT_SINGLE
                        options:
                          nullable: true
                          description: >
                            선택지.
                            - SELECT_SINGLE/SELECT_MULTI: 배열 필수(빈 배열 금지)
                            - 그 외: 반드시 null
                          oneOf:
                            - type: array
                              minItems: 1
                              items: { type: string }
                          example: ["MALE", "FEMALE", "OTHER", "UNKNOWN"]
                        value:
                          nullable: true
                          description: >
                            사용자 응답 값.
                            - BOOLEAN: boolean
                            - TEXT_INPUT: string
                            - NUMBER_INPUT: number
                            - SELECT_SINGLE: string
                            - SELECT_MULTI: string[]
                            - DATE: string(date)
                          oneOf:
                            - type: boolean
                            - type: string
                            - type: number
                            - type: array
                              items: { type: string }
                          example: MALE

                  additionalOnboardingAnswers:
                    type: array
                    description: 추가 온보딩(가변 질문) 응답 리스트
                    items: *OnboardingAnswer

              examples:
                mock1:
                  summary: Scenario 1
                  value:
                    requiredOnboardingAnswers:
                      - id: 100001
                        title: 성별
                        type: SELECT_SINGLE
                        options: ["MALE", "FEMALE", "OTHER", "UNKNOWN"]
                        value: MALE

                      - id: 100002
                        title: 생년월일
                        type: DATE
                        options: null
                        value: "1999-01-01"

                      - id: 100003
                        title: 거주지역(시군구)
                        type: TEXT_INPUT
                        options: null
                        value: "서울특별시 마포구"

                      - id: 100004
                        title: 결혼 여부
                        type: BOOLEAN
                        options: null
                        value: false

                      - id: 100005
                        title: 무주택 여부
                        type: BOOLEAN
                        options: null
                        value: true

                      - id: 100006
                        title: 세대 내 역할
                        type: SELECT_SINGLE
                        options: ["HOUSEHOLDER", "MEMBER"]
                        value: HOUSEHOLDER

                      - id: 100007
                        title: 가구원 수
                        type: NUMBER_INPUT
                        options: null
                        value: 1

                      - id: 100008
                        title: 가구 총 월 수입(원)
                        type: NUMBER_INPUT
                        options: null
                        value: 4000000

                    additionalOnboardingAnswers:
                      - id: 900001
                        title: "청약통장 정보 입력해주세요"
                        type: BOOLEAN
                        options: null
                        value: true

                      - id: 900005
                        title: "복수 선택 질문"
                        type: SELECT_MULTI
                        options: ["옵션A", "옵션B", "옵션C"]
                        value: ["옵션A", "옵션C"]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
   
    put:
          tags: [mypage]
          summary: 맞춤 프로필 상세 전체 갱신(Upsert)
          description: >
            맞춤 추천/자격 판단에 필요한 프로필 상세정보(필수/추가 온보딩 응답)를 **전체 갱신**합니다.

            - 전달된 answers를 기준으로 사용자 응답을 upsert 합니다.
            - unknown=true 인 경우 value는 null 허용(미응답/모름 처리)
            - unknown=false 인 경우 value는 type에 맞는 타입이어야 합니다.
          operationId: mypage_upsertProfileDetail
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  additionalProperties: false
                  required: [answers]
                  properties:
                    answers:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        additionalProperties: false
                        required: [additionalOnboardingId, type, unknown, value]
                        properties:
                          additionalOnboardingId:
                            type: integer
                            format: int64
                            example: 900001
                          type:
                            type: string
                            enum: [BOOLEAN, TEXT_INPUT, NUMBER_INPUT, SELECT_SINGLE, SELECT_MULTI, DATE]
                            example: BOOLEAN
                          unknown:
                            type: boolean
                            example: false
                          value:
                            nullable: true
                            oneOf:
                              - type: boolean
                              - type: string
                              - type: number
                              - type: array
                                items: { type: string }
                            example: true
                examples:
                  single:
                    summary: 단일 응답 갱신 예시
                    value:
                      answers:
                        - additionalOnboardingId: 900001
                          type: BOOLEAN
                          unknown: false
                          value: true
          responses:
            "204":
              description: No Content
            "400":
              description: Bad Request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "401":
              description: Unauthorized
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
    


  /api/mypage/scraps:
    get:
      tags:
      - mypage
      summary: 내가 찜한 공고 리스트
      description: >
        유저가 찜(스크랩)한 공고 목록을 **커서 기반 페이지네이션**으로 조회합니다.
        JWT는 HttpOnly 쿠키로 인증됩니다.
      operationId: mypage_listScraps
      parameters:
        - name: cursor
          in: query
