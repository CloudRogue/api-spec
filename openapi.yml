  /api/announcements/{announcementId}/detail/eligibility/check:
    put:
      tags:
        - announcements
      summary: 자격 자가 진단 실행
      description: >
        유저 프로필/온보딩 데이터와 공고 기준을 대조하여 자격 진단 결과를 반환합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: announcements_checkEligibility
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 공고 PK
          example: 900001

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  # 1) 지원 가능
                  - type: object
                    required:
                      - supportStatus
                      - diagnosedAt
                      - predictedRank
                      - predictedBonusPoints
                      - trace
                    additionalProperties: false
                    properties:
                      supportStatus:
                        type: string
                        enum: [ELIGIBLE, INELIGIBLE, PENDING]
                        description: 지원 상태 (ELIGIBLE=지원가능, INELIGIBLE=지원불가능, PENDING=진단보류)
                        example: ELIGIBLE
                      diagnosedAt:
                        type: string
                        format: date-time
                        description: 진단 최신 일시(서버 기준)
                        example: "2026-01-09T16:10:00+09:00"
                      predictedRank:
                        type: integer
                        enum: [1, 2, 3]
                        description: 예상 순위 (지원 가능/진단 보류일 때 제공)
                        example: 900001

                      predictedBonusPoints:
                        type: integer
                        minimum: 0
                        description: 예상 가산점 (지원 가능/진단 보류일 때 제공)
                        example: 900001

                      trace:
                        type: array
                        description: >
                          가변 판정 결과 리스트(심사 요소별).
                          key는 질문 텍스트, passed는 통과 여부, message는 AI 판단 근거/설명입니다.
                        items:
                          type: object
                          required: [key, passed, message]
                          additionalProperties: false
                          properties:
                            key:
                              type: string
                              description: 질문 텍스트(사용자에게 노출되는 문구)
                              example: "무주택 세대구성원인가요?"
                            passed:
                              type: boolean
                              description: 해당 요소 통과 여부
                              example: true
                            message:
                              type: string
                              description: AI가 어떻게 판단했는지(근거/설명)
                              example: "프로필 상 '주택 보유: 없음'으로 확인되어 무주택 요건을 충족합니다."
                    allOf:
                      - type: object
                        properties:
                          supportStatus: { type: string, enum: [ELIGIBLE] }

                  # 2) 지원 불가능
                  - type: object
                    required: [supportStatus, diagnosedAt, trace]
                    additionalProperties: false
                    properties:
                      supportStatus:
                        type: string
                        enum: [ELIGIBLE, INELIGIBLE, PENDING]
                        description: 지원 상태 (ELIGIBLE=지원가능, INELIGIBLE=지원불가능, PENDING=진단보류)
                        example: INELIGIBLE
                      diagnosedAt:
                        type: string
                        format: date-time
                        description: 진단 최신 일시(서버 기준)
                        example: "2026-01-09T16:10:00+09:00"
                      trace:
                        type: array
                        description: >
                          가변 판정 결과 리스트(심사 요소별).
                          key는 질문 텍스트, passed는 통과 여부, message는 AI 판단 근거/설명입니다.
                        items:
                          type: object
                          required: [key, passed, message]
                          additionalProperties: false
                          properties:
                            key:
                              type: string
                              description: 질문 텍스트(사용자에게 노출되는 문구)
                              example: "무주택 세대구성원인가요?"
                            passed:
                              type: boolean
                              description: 해당 요소 통과 여부
                              example: false
                            message:
                              type: string
                              description: AI가 어떻게 판단했는지(근거/설명)
                              example: "프로필 상 '주택 보유: 있음'으로 확인되어 무주택 요건을 충족하지 않습니다."
                    allOf:
                      - type: object
                        properties:
                          supportStatus: { type: string, enum: [INELIGIBLE] }

                  # 3) 진단 보류 (항상 추가 온보딩 필요)
                  - type: object
                    required:
                      - supportStatus
                      - diagnosedAt
                      - predictedRank
                      - predictedBonusPoints
                      - needsAdditionalOnboarding
                      - requiredOnboardingProfileIds
                      - trace
                    additionalProperties: false
                    properties:
                      supportStatus:
                        type: string
                        enum: [ELIGIBLE, INELIGIBLE, PENDING]
                        description: 지원 상태 (ELIGIBLE=지원가능, INELIGIBLE=지원불가능, PENDING=진단보류)
                        example: PENDING
                      diagnosedAt:
                        type: string
                        format: date-time
                        description: 진단 최신 일시(서버 기준)
                        example: "2026-01-09T16:10:00+09:00"
                      predictedRank:
                        type: integer
                        enum: [1, 2, 3]
                        description: 예상 순위 (지원 가능/진단 보류일 때 제공)
                        example: 900001

                      predictedBonusPoints:
                        type: integer
                        minimum: 0
                        description: 예상 가산점 (지원 가능/진단 보류일 때 제공)
                        example: 900001

                      needsAdditionalOnboarding:
                        type: boolean
                        enum: [true]
                        description: 진단 보류 시 추가 온보딩 필요 여부 (현재는 항상 true)
                        example: true
                      requiredOnboardingProfileIds:
                        type: array
                        minItems: 1
                        description: 추가로 필요한 온보딩 질문(Profile) PK 리스트
                        items:
                          type: integer
                          format: int64
                        example: [101, 203, 305]
                      trace:
                        type: array
                        description: >
                          가변 판정 결과 리스트(심사 요소별).
                          key는 질문 텍스트, passed는 통과 여부, message는 AI 판단 근거/설명입니다.
                        items:
                          type: object
                          required: [key, passed, message]
                          additionalProperties: false
                          properties:
                            key:
                              type: string
                              description: 질문 텍스트(사용자에게 노출되는 문구)
                              example: "가구원 수는 몇 명인가요?"
                            passed:
                              type: boolean
                              description: 해당 요소 통과 여부
                              example: false
                            message:
                              type: string
                              description: AI가 어떻게 판단했는지(근거/설명)
                              example: "가구원 수 정보가 없어 세대원 기준 판단이 불가능합니다. 추가 입력이 필요합니다."
                    allOf:
                      - type: object
                        properties:
                          supportStatus: { type: string, enum: [PENDING] }

              examples:
                eligible:
                  summary: 지원 가능 (ELIGIBLE)
                  value:
                    supportStatus: ELIGIBLE
                    diagnosedAt: "2026-01-09T16:10:00+09:00"
                    predictedRank: 1
                    predictedBonusPoints: 3
                    trace:
                      - key: "무주택 세대구성원인가요?"
                        passed: true
                        message: "프로필 상 '주택 보유: 없음'으로 확인되어 무주택 요건을 충족합니다."
                      - key: "소득이 4분위 이하인가요?"
                        passed: true
                        message: "소득 3분위로 확인되어 기준(4분위 이하)을 충족합니다."

                ineligible:
                  summary: 지원 불가능 (INELIGIBLE)
                  value:
                    supportStatus: INELIGIBLE
                    diagnosedAt: "2026-01-09T16:10:00+09:00"
                    trace:
                      - key: "무주택 세대구성원인가요?"
                        passed: false
                        message: "프로필 상 '주택 보유: 있음'으로 확인되어 무주택 요건을 충족하지 않습니다."
                      - key: "소득이 4분위 이하인가요?"
                        passed: true
                        message: "소득 3분위로 확인되어 기준(4분위 이하)을 충족합니다."

                pending_need_onboarding:
                  summary: 진단 보류 (PENDING, 추가 온보딩 필요)
                  value:
                    supportStatus: PENDING
                    diagnosedAt: "2026-01-09T16:10:00+09:00"
                    predictedRank: 2
                    predictedBonusPoints: 1
                    needsAdditionalOnboarding: true
                    requiredOnboardingProfileIds: [101, 203, 305]
                    trace:
                      - key: "가구원 수는 몇 명인가요?"
                        passed: false
                        message: "가구원 수 정보가 없어 세대원 기준 판단이 불가능합니다. 추가 입력이 필요합니다."
                      - key: "무주택 세대구성원인가요?"
                        passed: true
                        message: "프로필 상 '주택 보유: 없음'으로 확인되어 무주택 요건을 충족합니다."

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "403":
          description: Forbidden (온보딩 미완료)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "409":
          description: 공고 기준 데이터 미구성 등으로 진단 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /api/announcements/application-manage/applied:
    get:
      tags:
        - announcements-management
      summary: (사용자) 신청 관리 - 지원 완료 후 진행 중(APPLYING) 공고 목록 조회
      description: >
        유저가 지원 완료한 공고 중 현재 진행 상태가 APPLYING 인 목록을
        커서 기반 무한 스크롤로 조회합니다.

        - cursor가 없으면 최초 페이지로 간주합니다.
        - meta.nextCursor, meta.hasNext 로 다음 페이지를 조회합니다.
      operationId: announcements_getApplicationManageApplied
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 마지막으로 조회한 announcementId(다음 조회 시작 기준)
          example: 2006
        - name: size
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
          description: 페이지 크기
          example: 5

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - summary
                  - data
                  - meta
                properties:
                  summary:
                    type: object
                    additionalProperties: false
                    required:
                      - applyingCount
                      - documentWaitingCount
                      - finalWaitingCount
                      - closedCount
                    properties:
                      applyingCount:
                        type: integer
                        format: int32
                        minimum: 0
                        example: 3
                      documentWaitingCount:
                        type: integer
                        format: int32
                        minimum: 0
                        example: 5
                      finalWaitingCount:
                        type: integer
                        format: int32
                        minimum: 0
                        example: 2
                      closedCount:
                        type: integer
                        format: int32
                        minimum: 0
                        description: 발표 완료(CLOSED) 공고 총 개수
                        example: 12

                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - announcementId
                        - title
                        - dDay
                        - publisher
                        - housingType
                        - currentStatus
                        - endDate
                      properties:
                        announcementId:
                          type: integer
                          format: int64
                          example: 900001
                        title:
                          type: string
                          example: "제1차 서울특별시 장기안심주택 입주자 모집"
                        dDay:
                          type: integer
                          format: int32
                          description: D-day (0이면 D-0)
                          example: 1
                        publisher:
                          type: string
                          description: 제공처 표시 문자열
                          example: "SH 서울주택도시공사"
                        housingType:
                          type: string
                          description: 주택 유형(표시용)
                          example: "주택"
                        currentStatus:
                          type: string
                          enum: [APPLYING]
                          example: "APPLYING"
                        endDate:
                          type: string
                          format: date-time
                          description: 공고 접수 마감 일시
                          example: "2026-01-15T18:00:00"

                  meta:
                    type: object
                    additionalProperties: false
                    required:
                      - nextCursor
                      - hasNext
                      - size
                    properties:
                      nextCursor:
                        type: integer
                        format: int64
                        nullable: true
                        description: 다음 페이지 조회 커서(없으면 null 가능)
                        example: 2000
                      hasNext:
                        type: boolean
                        example: false
                      size:
                        type: integer
                        format: int32
                        example: 2

              examples:
                ok:
                  summary: APPLYING 목록 예시
                  value:
                    summary:
                      applyingCount: 3
                      documentWaitingCount: 5
                      finalWaitingCount: 2
                      closedCount: 12
                    data:
                      - announcementId: 900001
                        title: "제1차 서울특별시 장기안심주택 입주자 모집"
                        dDay: 1
                        publisher: "SH 서울주택도시공사"
                        housingType: "주택"
                        currentStatus: "APPLYING"
                        endDate: "2026-01-15T18:00:00"
                    meta:
                      nextCursor: 2000
                      hasNext: false
                      size: 2

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


