  /api/announcements/{announcementId}:
    get:
      tags:
      - announcements
      summary: 공고 상세 조회
      description: '공고 상세 정보를 반환합니다. eligibility는 원문에서 추출된 "지원 조건"을 정규화한 구조입니다.
        일부 조건은 원문에 없거나 추출 실패 시 null/빈 값일 수 있습니다. 공고에 조건 정보가 전혀 없으면 eligibility 자체가 null일 수 있습니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.

        '
      operationId: announcements_getAnnouncementDetail
      parameters:
      - name: announcementId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 공고 PK
        example: 12345
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - announcementId
                - publisher
                - title
                - housingType
                - startDate
                - endDate
                - publishedAt
                - status
                - originalUrl
                - externalApplyUrl
                - eligibility
                properties:
                  announcementId:
                    type: integer
                    format: int64
                    description: 공고 PK
                    example: 12345
                  publisher:
                    type: string
                    description: 발행처(기관/지자체 등)
                    example: LH 한국토지주택공사
                  title:
                    type: string
                    description: 공고명
                    example: 청년매입임대주택 모집 공고
                  housingType:
                    type: string
                    description: 주택 유형(앱 뱃지/필터에 사용)
                    example: 행복주택
                  startDate:
                    type: string
                    format: date
                    description: 공고 시작일
                    example: '2025-12-01'
                  endDate:
                    type: string
                    format: date
                    description: 공고 마감일
                    example: '2026-01-15'
                  publishedAt:
                    type: string
                    format: date
                    description: 발표일(게시일)
                    example: '2025-12-30'
                  status:
                    type: string
                    description: 공고 접수 상태(앱 뱃지에 사용)
                    enum:
                    - OPEN
                    - DUE_SOON
                    - UPCOMING
                    - CLOSED
                    example: DUE_SOON
                  dDay:
                    type: integer
                    nullable: true
                    description: 마감까지 남은 일수(DUE_SOON/OPEN에서 의미)
                    example: 3
                  rentGtn:
                    type: number
                    nullable: true
                    description: 최소임대보증금
                    example: 5000000
                  enty:
                    type: number
                    nullable: true
                    description: 최소_계약금
                    example: 500000
                  prtpay:
                    type: number
                    nullable: true
                    description: 최소_중도금
                    example: 1000000
                  surlus:
                    type: number
                    nullable: true
                    description: 최소_잔금
                    example: 3500000
                  mtRntchrg:
                    type: number
                    nullable: true
                    description: 최소월임대료
                    example: 250000
                  fullAdres:
                    type: string
                    nullable: true
                    description: 전체주소
                    example: 서울특별시 강남구 ...
                  rnCodeNm:
                    type: string
                    nullable: true
                    description: 도로명 (주소가 도로명주소일 때 표시)
                    example: 테헤란로
                  refrnLegaldongNm:
                    type: string
                    nullable: true
                    description: 참조_법정동명 (주소가 지번주소일 때 표시)
                    example: 역삼동
                  url:
                    type: string
                    format: uri
                    nullable: true
                    description: 모집공고 URL
                    example: https://example.org/announcements/12345
                  eligibility:
                    type: object
                    nullable: true
                    description: '지원 조건(정규화) - 없는 항목은 null. 공고에 조건 정보가 전혀 없으면 eligibility 자체가 null일 수 있습니다.'
                    properties:
                      age:
                        type: object
                        nullable: true
                        description: 나이 요건(없으면 null)
                        properties:
                          min:
                            type: integer
                            nullable: true
                            minimum: 0
                            example: 19
                          max:
                            type: integer
                            nullable: true
                            minimum: 0
                            example: 34
                          displayText:
                            type: string
                            nullable: true
                            example: 만 19~34세
                      region:
                        type: object
                        nullable: true
                        description: 거주지역 요건(정규화, 없으면 null)
                        properties:
                          ruleType:
                            type: string
                            nullable: true
                            enum:
                            - INCLUDE
                            - EXCLUDE
                            description: 'codes 적용 방식

                              - INCLUDE: codes에 포함된 지역만 허용

                              - EXCLUDE: codes에 포함된 지역은 제외

                              '
                            example: INCLUDE
                          codes:
                            type: array
                            items:
                              type: string
                            description: 대상 지역 코드 목록
                            example:
                            - '11'
                          displayText:
                            type: string
                            nullable: true
                            description: 화면 표기용(원문 요약)
                            example: 서울특별시 거주
                      income:
                        type: object
                        nullable: true
                        description: 소득 요건(정규화, 없으면 null)
                        properties:
                          metric:
                            type: string
                            nullable: true
                            enum:
                            - MEDIAN_INCOME_PERCENT
                            - INCOME_DECILE
                            - HEALTH_INSURANCE_PREMIUM
                            description: '값 해석 기준(단위/의미)

                              - MEDIAN_INCOME_PERCENT: 중위소득 퍼센트(예: 150 = 150%)

                              - INCOME_DECILE: 소득 분위(예: 3 = 3분위)

                              - HEALTH_INSURANCE_PREMIUM: 건강보험료(원, 월 기준)

                              '
                            example: MEDIAN_INCOME_PERCENT
                          operator:
                            type: string
                            nullable: true
                            enum:
                            - LTE
                            - LT
                            - GTE
                            - GT
                            - EQ
                            - BETWEEN
                            description: '비교 연산자

                              - LTE/LT/GTE/GT/EQ: value 단일 기준

                              - BETWEEN: value(하한) ~ value2(상한) 범위

                              '
                            example: LTE
                          value:
                            type: number
                            nullable: true
                            description: 기준값(metric에 따라 단위 상이)
                            example: 150
                          value2:
                            type: number
                            nullable: true
                            description: operator=BETWEEN일 때 상한값
                            example: 200
                          householdSizeMin:
