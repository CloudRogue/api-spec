  /api/community/comments/{commentPk}/report:
    post:
      tags:
      - community
      summary: 댓글 신고
      description: 댓글을 신고합니다. 누적 3회 도달 시 댓글이 소프트 삭제 처리될 수 있습니다.
      operationId: community_reportComment
      parameters:
      - name: commentPk
        in: path
        required: true
        description: 신고할 댓글 PK
        schema:
          type: integer
          format: int64
          example: 101
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 댓글 신고 요청
              required:
              - reasonType
              properties:
                reasonType:
                  type: string
                  description: 신고 사유 타입
                  enum:
                  - PROFANITY
                  - SEXUAL
                  - PERSONAL_INFO
                  - SPAM
                  example: SPAM
                reason:
                  type: string
                  nullable: true
                  description: 추가 설명(선택)
                  example: 광고 링크 반복 도배
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 신고 처리 결과(누적 3회 도달 시 소프트 삭제)
                required:
                - commentPk
                - action
                - reportCount
                - deleted
                - deletedAt
                properties:
                  commentPk:
                    type: integer
                    format: int64
                    description: 신고 처리된 댓글 PK
                    example: 101
                  action:
                    type: string
                    description: 처리 결과
                    enum:
                    - REPORTED
                    - SOFT_DELETED
                    example: REPORTED
                  reportCount:
                    type: integer
                    description: 현재 누적 신고 수
                    example: 2
                  deleted:
                    type: boolean
                    description: 소프트 삭제 여부
                    example: false
                  deletedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: 삭제 시각(삭제되었을 때만)
                    example: null
