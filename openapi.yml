      summary: 공고별 댓글 목록 조회(질문/답변 구조)
      description: 공고 상세 하단의 Q/A 댓글을 페이지 기반으로 조회합니다. 비속어/개인정보/스팸/성적 표현은 마스킹(*) 처리될
        수 있습니다.
      operationId: community_listComments
      parameters:
      - name: announcementId
        in: path
        required: true
        description: 댓글을 조회할 공고 ID
        schema:
          type: integer
          format: int64
          example: 900001
      - name: page
        in: query
        required: false
        description: 0부터 시작하는 페이지 번호
        schema:
          type: integer
          default: 0
          minimum: 0
          example: 0
      - name: size
        in: query
        required: false
        description: 페이지 크기
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
          example: 20
      - name: sort
        in: query
        required: false
        description: '정렬 기준(기본: 최신순)'
        schema:
          type: string
          default: LATEST
          enum:
          - LATEST
          - POPULAR
          example: LATEST
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: 댓글 목록 응답
                required:
                - items
                - meta
                properties:
                  items:
                    type: array
                    description: 댓글 목록(parentId=0이면 질문, parentId>0이면 답변)
                    items:
                      type: object
                      description: 댓글 단건
                      required:
                      - id
                      - announcementId
                      - parentId
                      - kind
                      - content
                      - contentFilter
                      - likeCount
                      - reportCount
                      - deleted
                      - createdAt
                      - updatedAt
                      - author
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: 댓글 PK
                          example: 900001
                        announcementId:
                          type: integer
                          format: int64
                          description: 공고 ID
                          example: 900001
                        parentId:
                          type: integer
                          format: int64
                          description: 부모 댓글 PK(없으면 0, 답변이면 질문 댓글 PK)
                          example: 900001

                        kind:
                          type: string
                          description: 댓글 유형(질문/답변)
                          enum:
                          - QUESTION
                          - ANSWER
                          example: QUESTION
                        content:
                          type: string
                          description: 댓글 내용(필터링 대상은 마스킹(*) 처리, 소프트삭제면 '삭제된 댓글입니다.'로
                            내려갈 수 있음)
                          example: 이 공고는 **** 기준이 어떻게 되나요?
                        contentFilter:
                          type: string
                          description: 콘텐츠 필터링 상태
                          enum:
                          - NONE
                          - PROFANITY
                          - SEXUAL
                          - PERSONAL_INFO
                          - SPAM
                          example: PROFANITY
                        likeCount:
                          type: integer
                          description: 좋아요 수
                          example: 7
                        reportCount:
                          type: integer
                          description: 누적 신고 수
                          example: 2
                        deleted:
                          type: boolean
                          description: '소프트 삭제 여부(예: 신고 3회 누적 시 true)'
                          example: false
                        deletedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 삭제 시각(삭제되지 않았다면 null)
                          example: null
                        createdAt:
                          type: string
                          format: date-time
