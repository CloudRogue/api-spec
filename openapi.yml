                  items:
                    type: array
                    description: 찜(스크랩)한 공고 목록
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - announcementId
                        - title
                        - housingType
                        - startDate
                        - endDate
                        - publishedAt
                        - publisher
                        - status
                      properties:
