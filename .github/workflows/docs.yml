name: Deploy ReDoc to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bundle OpenAPI (resolve $ref)
        run: |
          npx @redocly/cli@latest bundle openapi.yml -o openapi.bundled.yml

      - name: Build ReDoc HTML
        run: |
          npx redoc-cli@latest bundle openapi.bundled.yml -o index.html

      - name: Prepare artifact
        run: |
          mkdir -p _site
          mv index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
