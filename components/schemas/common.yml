ErrorResponse:
  type: object
  description: 실패 응답 공통 포맷
  required:
  - code
  - message
  - status
  - timestamp
  - traceId
  properties:
    code:
      type: string
      description: 에러 코드(서버 정의)
      example: VALIDATION_ERROR
    message:
      type: string
      description: 에러 메시지
      example: 요청 값이 올바르지 않습니다.
    status:
      type: integer
      description: HTTP 상태 코드
      example: 400
    timestamp:
      type: string
      format: date-time
      description: 에러 발생 시각
      example: '2025-12-29T09:10:00+09:00'
    traceId:
      type: string
      description: 추적용 ID(로그 상관관계)
      example: tr_01JH6Z9A1B2C3D4E5F6G7H8J9K
    details:
      type: object
      nullable: true
      description: 추가 정보(필드 에러 등, 선택)
      example:
        field: parentId
        reason: 답변 댓글은 parentId가 0이 될 수 없습니다.
PageMeta:
  type: object
  description: 페이지 메타 정보
  required:
  - page
  - size
  - totalElements
  - totalPages
  properties:
    page:
      type: integer
      description: 0부터 시작하는 페이지 번호
      example: 0
    size:
      type: integer
      description: 페이지 크기
      example: 20
    totalElements:
      type: integer
      description: 전체 아이템 수
      example: 134
    totalPages:
      type: integer
      description: 전체 페이지 수
      example: 7
