      operationId: admin_listAnnouncementInboxes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    description: 신규 처리 대상 공고 목록(서버 내부 큐/대기열에서 반환)
                    items:
                      type: object
                      required: [announcementId, createdAt, title]
                      properties:
                        announcementId:
                          type: integer
                          format: int64
                          description: 공고 PK
                          example: 12345
                        createdAt:
                          type: string
                          format: date-time
                          description: 유입 시각(ISO-8601)
                          example: "2025-12-29T00:10:15+09:00"
                        title:
                          type: string
                          description: 공고 제목
                          example: "청년매입임대주택 모집 공고"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/announcements/{announcementId}:
    get:
      tags: [admin, announcements]
      summary: (어드민) 공고 AI 요약/추출 결과 조회(참고용)
      description: >
        공고(announcementId)에 대해 수집/AI가 생성한 요약/추출 결과를 조회합니다.
        이 데이터는 참고용이며 정확성을 보장하지 않습니다.
        오류/누락이 있는 경우 어드민이 수기 작성한 정규 공고 데이터(별도 저장 API) 기준으로 내부 교정합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: admin_getAnnouncementAiDigest
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 12345
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [provider, title, contentText]
                properties:
                  provider:
                    type: string
                    enum: [LH, SH]
                    description: 공고 기관(추출값)
                    example: LH
                  title:
                    type: string
                    description: 공고명(추출값)
                    example: "청년매입임대주택 모집 공고"
                  publisher:
                    type: string
                    nullable: true
                    description: 발행처(추출값)
                    example: "LH 한국토지주택공사"
                  startDate:
                    type: string
                    format: date
                    nullable: true
                    description: 공고 시작일(추출값, 없을 수 있음)
                    example: "2025-12-01"
                  endDate:
                    type: string
                    format: date
                    nullable: true
                    description: 공고 마감일(추출값, 없을 수 있음)
                    example: "2026-01-15"
                  contentText:
                    type: string
                    description: 원문/가공 본문(추출값)
                    example: "본 공고는 ... (중략)"
                  aiDigest:
                    type: string
                    nullable: true
                    description: AI 요약 텍스트
                    example: "청년 대상 매입임대주택 모집. 온라인 신청..."
                  extracted:
                    type: object
                    nullable: true
                    description: AI가 구조화 시도한 추출 결과(정확성 보장 없음)
                    properties:
                      target: { type: string, nullable: true, example: "만 19~34세 무주택 청년" }
                      amount: { type: string, nullable: true, example: "임대료 시세 대비 30% 수준" }
                      period: { type: string, nullable: true, example: "2026-01-01 ~ 2026-01-31" }
                      method: { type: string, nullable: true, example: "온라인 신청" }
                  externalApplyUrl:
                    type: string
                    format: uri
                    nullable: true
                    description: 외부 신청 링크(추출값)
                    example: "https://apply.example/lh/12345"
                  originalUrl:
                    type: string
                    format: uri
                    nullable: true
                    description: 원문 링크(추출값)
                    example: "https://original.example/doc/abc"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Not Found (해당 공고의 AI 요약/추출 데이터가 없음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [admin, announcements]
      summary: (어드민) 공고 지원자격(정규화) 수기 확정 저장
      operationId: admin_upsertAnnouncementEligibility
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK(사전 발급된 ID)
          example: 12345

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizerText, eligibility]
              properties:
                organizerText:
                  type: string
                  description: 주최/주관(기관명) - 수기 입력(자유 텍스트)
                  example: "서울특별시 / 서울주택도시공사(SH)"

                organizerDeptText:
                  type: string
                  nullable: true
                  description: 담당 부서/사업명 등 추가 표기(선택)
                  example: "청년주거지원과"

                eligibility:
                  type: object
                  description: 지원 자격(정규화) - DB 필터링/매칭 가능한 구조
                  required: [region, income]
                  properties:
                    age:
                      type: object
                      nullable: true
                      properties:
                        min: { type: integer, nullable: true, minimum: 0, example: 19 }
                        max: { type: integer, nullable: true, minimum: 0, example: 34 }
                        displayText:
                          type: string
                          nullable: true
                          example: "만 19~34세"

                    region:
                      type: object
                      description: 거주지역 요건(정규화)
                      required: [scope, ruleType, codes]
                      properties:
                        scope:
                          type: string
                          enum: [NATIONWIDE, SIDO, SIGUNGU, DONG, CUSTOM]
                          example: SIDO
                        ruleType:
                          type: string
                          enum: [INCLUDE, EXCLUDE]
                          example: INCLUDE
                        codes:
                          type: array
                          items: { type: string }
                          example: ["11"]   # 시도코드: 서울
                        displayText:
                          type: string
                          nullable: true
                          example: "서울특별시 거주"

                    income:
                      type: object
                      description: 소득 요건(정규화)
                      required: [metric, operator, value]
                      properties:
                        metric:
                          type: string
                          enum: [MEDIAN_INCOME_PERCENT, INCOME_DECILE, HEALTH_INSURANCE_PREMIUM]
                          example: MEDIAN_INCOME_PERCENT
                        operator:
                          type: string
                          enum: [LTE, LT, GTE, GT, EQ, BETWEEN]
                          example: LTE
                        value:
                          type: number
                          example: 150
                        value2:
                          type: number
                          nullable: true
                          example: 200
                        householdSizeMin:
                          type: integer
                          nullable: true
                          minimum: 1
                          example: 1
                        householdSizeMax:
                          type: integer
                          nullable: true
                          minimum: 1
                          example: 3
                        displayText:
                          type: string
                          nullable: true
                          example: "중위소득 150% 이하"

                    notes:
                      type: string
                      nullable: true
                      description: 예외/특기사항(정규화가 어려운 내용만)
                      example: "일부 유형은 신혼부부 우선"

                originalUrl:
                  type: string
                  format: uri
                  nullable: true
                  description: 원문 링크(선택)

      responses:
        "204": { description: No Content (저장 완료), content: {} }
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

