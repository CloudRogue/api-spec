                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

############################################################
# 6) POLICIES
############################################################

  /api/policies/personalized:
    get:
      tags: [policies]
      summary: 맞춤 정책 목록 조회
      description: >
        로그인 + 온보딩(프로필) 완료 사용자를 대상으로,
        유저 프로필(지역/소득/상황태그 등) 기반으로 맞춤 정책 목록을 반환합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: policies_getPersonalizedPolicies
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: 0부터 시작하는 페이지 번호
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: 페이지 크기
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    description: 맞춤 정책 목록
                    items:
                      type: object
                      required: [policyId, title, updatedAt]
                      properties:
                        policyId:
                          type: integer
                          format: int64
                          description: 정책 상세 PK
                          example: 8800123
                        title:
                          type: string
                          description: 정책명
                          example: "청년 월세 지원 사업"
                        updatedAt:
                          type: string
                          format: date-time
                          description: 최종 수정일(ISO-8601)
                          example: "2025-12-29T00:10:15+09:00"
                        applicationStartDate:
                          type: string
                          format: date
                          nullable: true
                          description: 신청 시작일(없으면 null)
                          example: "2026-01-01"
                        applicationEndDate:
                          type: string
                          format: date
                          nullable: true
                          description: 신청 마감일(없으면 null)
                          example: "2026-01-31"
                  meta:
                    type: object
                    required: [page, size, totalElements, totalPages]
                    properties:
                      page:
                        type: integer
                        minimum: 0
                        description: 현재 페이지 번호(0부터)
                        example: 0
                      size:
                        type: integer
                        minimum: 1
                        maximum: 100
                        description: 페이지 크기
                        example: 20
                      totalElements:
                        type: integer
                        minimum: 0
                        description: 전체 항목 수
                        example: 134
                      totalPages:
                        type: integer
                        minimum: 0
                        description: 전체 페이지 수
                        example: 7
        "401":
          description: Unauthorized (로그인 필요)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "403":
          description: Forbidden (온보딩/프로필 미완료 등으로 맞춤 제공 불가)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/announcements/{announcementId}/policies:
    get:
      tags: [policies]
      summary: 공고 기준 정책 목록 조회
      description: >
        특정 공고(announcementId)와 연관된 정책 목록을 반환합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
        (공고 상세에서 함께 노출되는 '관련 정책' 섹션 등에 사용)
      operationId: policies_listByAnnouncementId
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 12345
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: 0부터 시작하는 페이지 번호
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: 페이지 크기
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    description: 공고 연관 정책 목록
                    items:
                      type: object
                      required: [policyId, title, updatedAt]
                      properties:
                        policyId:
                          type: integer
                          format: int64
                          description: 정책 상세 PK
                          example: 8800123
                        title:
                          type: string
                          description: 정책명
                          example: "청년 월세 지원 사업"
                        updatedAt:
                          type: string
                          format: date-time
                          description: 최종 수정일(ISO-8601)
                          example: "2025-12-29T00:10:15+09:00"
                        applicationStartDate:
                          type: string
                          format: date
                          nullable: true
                          description: 신청 시작일(없으면 null)
                          example: "2026-01-01"
                        applicationEndDate:
                          type: string
                          format: date
                          nullable: true
                          description: 신청 마감일(없으면 null)
                          example: "2026-01-31"
                  meta:
                    type: object
                    required: [page, size, totalElements, totalPages]
                    properties:
                      page:
                        type: integer
                        minimum: 0
                        description: 현재 페이지 번호(0부터)
                        example: 0
                      size:
                        type: integer
                        minimum: 1
                        maximum: 100
                        description: 페이지 크기
                        example: 20
                      totalElements:
                        type: integer
                        minimum: 0
                        description: 전체 항목 수
                        example: 12
                      totalPages:
                        type: integer
                        minimum: 0
                        description: 전체 페이지 수
                        example: 1
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Not Found (공고 없음 또는 연관 정책 없음 - 운영 정책에 따름)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/policies/{policyId}:
    get:
      tags: [policies]
      summary: 정책 상세 조회
      description: >
        정책 상세 정보를 반환합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: policies_getPolicyDetail
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 정책 상세 PK
          example: 8800123
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [policyId, title, updatedAt, status, descriptionText]
                properties:
                  status:
                    type: object
                    description: 상태/필터 정보(화면 상단 배지/필터 표시용)
                    required: [periodStatus]
                    properties:
                      periodStatus:
                        type: string
                        description: 기간 상태
                        enum: [OPEN, UPCOMING, CLOSED, ALWAYS]
                        example: OPEN
                      regionFilter:
                        type: string
                        nullable: true
                        description: 지역 필터 요약(있으면 표시)
                        example: "서울특별시"
                      category:
                        type: string
                        nullable: true
                        description: 정책 분야(있으면 표시)
                        example: "주거"
                  policyId:
                    type: integer
                    format: int64
                    description: 정책 상세 PK
                    example: 8800123
                  title:
                    type: string
                    description: 정책명
                    example: "청년 월세 지원 사업"
                  policyNo:
                    type: string
                    nullable: true
                    description: 정책번호(원천에서 제공되는 식별자, 없으면 null)
                    example: "P-2026-001122"
                  updatedAt:
                    type: string
                    format: date-time
                    description: 최종 수정일(ISO-8601)
                    example: "2025-12-29T00:10:15+09:00"
                  viewCount:
                    type: integer
                    format: int64
                    nullable: true
                    description: 조회수(선택, 없으면 null)
                    example: 12034
                  scrapCount:
                    type: integer
                    format: int64
                    nullable: true
                    description: 스크랩 수(선택, 없으면 null)
                    example: 532
                  descriptionText:
                    type: string
                    description: 정책 설명(본문 텍스트)
                    example: "본 사업은 청년의 주거비 부담을 완화하기 위해 월세를 지원합니다..."
                  summary:
                    type: object
                    nullable: true
                    description: 정책 요약(있으면 표시)
                    properties:
                      field:
                        type: string
                        nullable: true
                        description: 정책분야
                        example: "주거"
                      benefit:
                        type: string
                        nullable: true
                        description: 지원내용
                        example: "월 최대 20만원 지원"
                      operatingPeriod:
                        type: string
                        nullable: true
                        description: 사업 운영 기간
                        example: "2026-01-01 ~ 2026-12-31"
                      applicationPeriod:
                        type: string
                        nullable: true
                        description: 사업 신청 기간
                        example: "2026-01-01 ~ 2026-01-31"
                      scale:
                        type: string
                        nullable: true
                        description: 지원 규모(명 등)
                        example: "총 5,000명"
                  eligibility:
                    type: object
                    nullable: true
                    description: 신청자격(항목별 텍스트)
                    properties:
                      age: { type: string, nullable: true, example: "만 19~34세" }
                      region: { type: string, nullable: true, example: "서울 거주" }
                      income: { type: string, nullable: true, example: "중위소득 150% 이하" }
                      education: { type: string, nullable: true, example: "무관" }
                      major: { type: string, nullable: true, example: "무관" }
                      employmentStatus: { type: string, nullable: true, example: "재직/미취업 모두 가능" }
                      specializedField: { type: string, nullable: true, example: "무관" }
                      additionalNotes: { type: string, nullable: true, example: "임대차계약서 필수" }
                      restricted: { type: string, nullable: true, example: "기타 동일/유사 사업 중복 수혜자" }
                  application:
                    type: object
                    nullable: true
                    description: 신청방법(절차/제출서류/사이트)
                    properties:
                      procedure: { type: string, nullable: true, example: "온라인 신청 → 서류 심사 → 발표" }
                      screeningAndResult: { type: string, nullable: true, example: "서류 심사 후 개별 통보" }
                      siteUrl:
                        type: string
                        format: uri
                        nullable: true
                        description: 신청 사이트 URL(있으면 제공)
                        example: "https://example.gov/apply"
                      documents: { type: string, nullable: true, example: "주민등록등본, 임대차계약서, 소득증빙" }
                  etc:
                    type: object
                    nullable: true
                    description: 기타 정보
                    properties:
                      notes: { type: string, nullable: true, example: "예산 소진 시 조기 마감 가능" }
                      hostAgency: { type: string, nullable: true, example: "OO시 청년정책과" }

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

############################################################
# 7) ToDo
############################################################

  /api/todos:
      get:
        tags: [todo]
        summary: "나의 Todo 목록 조회"
        description: "유저가 생성/보유한 Todo 목록을 페이지 기반으로 조회합니다."
        operationId: todo_listTodos
        parameters:
          - name: status
            in: query
            required: false
            description: "Todo 상태 필터(ACTIVE/COMPLETED)"
            schema:
              type: string
              enum: [ACTIVE, COMPLETED]
              default: ACTIVE
              example: "ACTIVE"
          - name: announcementId
            in: query
            required: false
            description: "특정 공고의 Todo만 조회할 때 사용하는 공고 ID"
            schema:
              type: string
              example: "ann_LH_20251229_000123"
          - name: page
            in: query
            required: false
            description: "0부터 시작하는 페이지 번호"
            schema:
              type: integer
              default: 0
              minimum: 0
              example: 0
          - name: size
            in: query
            required: false
            description: "페이지 크기"
            schema:
              type: integer
              default: 20
              minimum: 1
              maximum: 50
              example: 20
        responses:
          "200":
            description: "OK"
            content:
              application/json:
                schema:
                  type: object
                  description: "Todo 목록 응답"
                  required: [items, meta]
                  properties:
                    items:
                      type: array
                      description: "Todo 목록"
                      items:
                        type: object
                        description: "Todo 단건"
                        required: [id, title, completed, createdAt, updatedAt]
                        properties:
                          id:
                            type: integer
                            format: int64
                            description: "Todo PK"
                            example: 501
                          announcementId:
                            type: string
                            nullable: true
                            description: "연결된 공고 ID(없으면 null)"
                            example: "ann_LH_20251229_000123"
                          title:
                            type: string
                            description: "Todo 제목/단계명"
                            example: "서류접수"
                          completed:
                            type: boolean
                            description: "완료 여부"
                            example: false
                          dueDate:
                            type: string
                            format: date
                            nullable: true
                            description: "마감일(없으면 null)"
                            example: "2026-01-03"
                          order:
