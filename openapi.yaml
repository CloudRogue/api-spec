############################################################
  # 3) 마이페이지 - 체크리스트/캘린더/찜/신청기록
############################################################
  /api/mypage/profile:
    get:
      tags: [mypage]
      summary: 맞춤 프로필 조회
      operationId: mypage_getProfile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [regionSigungu, birthDate, incomeDecile, householdSize, situationTags]
                properties:
                  regionSigungu:
                    type: string
                    description: 거주지역(시군구). 맞춤 공고 필터링에 사용됩니다. 
                    example: "서울특별시 마포구"
                  birthDate:
                    type: string
                    format: date
                    description: 생년월일(YYYY-MM-DD). 연령 조건 판단에 사용됩니다.
                    example: "1999-01-01"
                  incomeDecile:
                    type: integer
                    minimum: 1
                    maximum: 10
                    description: 소득분위(1~10). 건보료 기준 가이드 기반 입력값입니다.
                    example: 4
                  householdSize:
                    type: integer
                    minimum: 1
                    description: 가구원 수(1 이상). 공고 자격 판단/추천에 사용될 수 있습니다.
                    example: 1
                  situationTags:
                    type: array
                    description: >
                      상황 태그(멀티 선택). 추천/필터링에 사용됩니다.
                      목록: 독립준비, 이사예정, 안전필요, 월세부담
                    items:
                      type: string
                      example: "이사예정"
                  onboardingCompleted:
                    type: boolean
                    description: 초기 온보딩(필수 프로필 입력) 완료 여부
                    example: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [mypage]
      summary: 맞춤 프로필 생성/전체 저장 (초기 온보딩 포함)
      description: >
        맞춤 프로필을 생성하거나 전체 필드를 덮어씁니다.
        초기 온보딩 입력에도 사용됩니다.
        userId는 ULID를 사용합니다.
      operationId: mypage_putProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [regionSigungu, birthDate, incomeDecile, householdSize, situationTags]
              properties:
                regionSigungu:
                  type: string
                  description: 거주지역(시군구). 맞춤 공고 필터링에 사용됩니다.
                  example: "서울특별시 마포구"
                birthDate:
                  type: string
                  format: date
                  description: 생년월일(YYYY-MM-DD). 연령 조건 판단에 사용됩니다.
                  example: "1999-01-01"
                incomeDecile:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: 소득분위(1~10). 건보료 기준 가이드 기반 입력값입니다.
                  example: 4
                householdSize:
                  type: integer
                  minimum: 1
                  description: 가구원 수(1 이상).
                  example: 1
                situationTags:
                  type: array
                  description: >
                    상황 태그(멀티 선택). 추천/필터링에 사용됩니다.
                    목록: 독립준비, 이사예정, 안전필요, 월세부담
                  items:
                    type: string
                    example: "이사예정"
