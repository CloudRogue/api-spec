openapi: 3.0.3
info:
  title: Youth Policy App API
  version: "0.1.0"
  description: >
    기능 요구사항 기반 초안 OpenAPI입니다. (컴포넌트/refs 미사용)
    인증/권한은 별도 securitySchemes 없이, 필요 엔드포인트에 Authorization 헤더 파라미터로 명시합니다.
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api.example.com
    description: Production

tags:
  - name: accounts
    description: 계정/인증 (카카오 OAuth2)
  - name: announcements
    description: 공고 (홈/상세/자격진단/원문)
  - name: mypage
    description: 마이페이지 (체크리스트/캘린더/찜/신청기록)
  - name: community
    description: 커뮤니티 (댓글/대댓글/좋아요/신고)
  - name: gamification
    description: 게이미피케이션 (미션/배지)
  - name: policies
    description: 정책 (청년정책 지원)
  - name: admin
    description: 관리자 기능 (공고/정책 관리)
  - name: chat
    description: 채팅 봇


paths:
  ############################################################
  # 1) 계정 / 인증 (Kakao OAuth 2.0)
  ############################################################
  /api/auth/kakao:
    get:
      tags: [accounts]
      summary: 카카오 로그인 시작 (백엔드가 전체 OAuth 처리, JWT는 쿠키로만)
      description: >
        프론트는 이 URL로 이동만 하면 됩니다.
        이후 인가/콜백/토큰교환/회원처리 전부 백엔드에서 처리합니다.

        로그인 성공 시 JWT를 HttpOnly 쿠키로 설정(Set-Cookie)하고,
        백엔드가 "/"로 리다이렉션(Location: /)합니다.

        userId는 ULID를 사용합니다.
      operationId: accounts_authKakao
      responses:
        "302":
          description: Redirect (성공 시 Set-Cookie 포함, Location은 "/")
          headers:
            Location:
              schema: { type: string }
              description: 로그인 성공 시 "/"
            Set-Cookie:
              schema: { type: string }
              description: JWT 쿠키(HttpOnly; Secure; SameSite 등 백엔드 정책)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/naver:
    get:
      tags: [accounts]
      summary: 네이버 로그인 시작 (백엔드가 전체 OAuth 처리, JWT는 쿠키로만)
      description: >
        프론트는 이 URL로 이동만 하면 됩니다.
        로그인 성공 시 JWT를 HttpOnly 쿠키로 설정(Set-Cookie)하고,
        백엔드가 "/"로 리다이렉션(Location: /)합니다.

        userId는 ULID를 사용합니다.
      operationId: accounts_authNaver
      responses:
        "302":
          description: Redirect (성공 시 Set-Cookie 포함, Location은 "/")
          headers:
            Location:
              schema: { type: string }
              description: 로그인 성공 시 "/"
            Set-Cookie:
              schema: { type: string }
              description: JWT 쿠키(HttpOnly; Secure; SameSite 등 백엔드 정책)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/google:
    get:
      tags: [accounts]
      summary: 구글 로그인 시작 (백엔드가 전체 OAuth 처리, JWT는 쿠키로만)
      description: >
        프론트는 이 URL로 이동만 하면 됩니다.

        로그인 성공 시 JWT를 HttpOnly 쿠키로 설정(Set-Cookie)하고,
        백엔드가 "/"로 리다이렉션(Location: /)합니다.

        userId는 ULID를 사용합니다.
      operationId: accounts_authGoogle
      responses:
        "302":
          description: Redirect (성공 시 Set-Cookie 포함, Location은 "/")
          headers:
            Location:
              schema: { type: string }
              description: 로그인 성공 시 "/"
            Set-Cookie:
              schema: { type: string }
              description: JWT 쿠키(HttpOnly; Secure; SameSite 등 백엔드 정책)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [accounts]
      summary: 로그아웃
      description: >
        JWT는 HttpOnly 쿠키로 관리됩니다.
        이 엔드포인트는 인증 쿠키를 만료(Set-Cookie)시켜 로그아웃 처리합니다.
        (userId는 ULID를 사용)
      operationId: accounts_logout
      responses:
        "204":
          description: No Content (인증 쿠키 만료)
          headers:
            Set-Cookie:
              schema: { type: string }
              description: >
                인증 쿠키를 만료시키는 Set-Cookie.
                (예: access=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=... )
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  ############################################################
  # 2) Announcements (공고 도메인)
  ############################################################

  /api/announcements/personalized:
    get:
      tags: [announcements]
      summary: 맞춤 공고 목록 조회
      description: >
        온보딩 완료 사용자 전용 맞춤 공고 목록입니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다. userId는 ULID를 사용합니다.
        비로그인(쿠키 없음/만료)이면 401, 온보딩 미완료면 403을 반환합니다.
      operationId: announcements_getPersonalizedAnnouncements
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: 0부터 시작하는 페이지 번호
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: 페이지 크기
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    description: 맞춤 공고 목록
                    items:
                      type: object
                      required: [announcementId, title, startDate, endDate, publisher, status]
                      properties:
                        announcementId:
                          type: integer
                          format: int64
                          description: 공고 PK
                          example: 12345
                        title:
                          type: string
                          description: 공고명
                          example: "OO시 반값 중개보수 지원사업"
                        startDate:
                          type: string
                          format: date
                          description: 공고 시작일
                          example: "2025-12-01"
                        endDate:
                          type: string
                          format: date
                          description: 공고 마감일
                          example: "2026-01-15"
                        publisher:
                          type: string
                          description: 발행처(기관/지자체 등)
                          example: "LH 한국토지주택공사"
                        status:
                          type: string
                          description: 공고 접수 상태(앱 뱃지에 사용)
                          enum: [OPEN, DUE_SOON, UPCOMING, CLOSED]
                          example: DUE_SOON
                  meta:
                    type: object
                    required: [page, size, totalElements, totalPages]
                    properties:
                      page: { type: integer, minimum: 0, example: 0, description: 현재 페이지 번호(0부터) }
                      size: { type: integer, minimum: 1, maximum: 100, example: 20, description: 페이지 크기 }
                      totalElements: { type: integer, minimum: 0, example: 134, description: 전체 항목 수 }
                      totalPages: { type: integer, minimum: 0, example: 7, description: 전체 페이지 수 }

        "401":
          description: Unauthorized (비로그인/토큰 만료)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "403":
          description: Forbidden (온보딩 미완료)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/announcements/banner:
    get:
      tags: [announcements]
      summary: 맞춤 추천 배너 (상황 태그 기반 1개)
      description: >
        유저의 상황 태그와 매칭되는 최우선 공고 1개를 배너로 반환합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
        조건 불충족(비로그인/온보딩 미완료/추천 대상 없음) 시 null을 반환할 수 있습니다.
        userId는 ULID를 사용합니다.
      operationId: announcements_getPersonalBanner
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  announcementId:
                    type: integer
                    format: int64
                    description: 공고 PK
                    example: 12345
                  title:
                    type: string
                    description: 공고명
                    example: "청년매입임대주택 모집 공고"
                  reasonTag:
                    type: string
                    description: 추천 사유가 된 상황 태그
                    example: "이사예정"
                  # 앱 내부 라우트는 프론트가 조합하는 것을 권장하므로 기본은 미제공.
                  # 필요 시 아래 필드를 활성화해서 내려줄 수 있음.
                  # detailPath:
                  #   type: string
                  #   description: 앱 내부 공고 상세 라우트(프론트 라우팅용)
                  #   example: "/announcements/12345"

  /api/announcements/{announcementId}:
    get:
      tags: [announcements]
      summary: 공고 상세 조회
      description: >
        공고 상세 정보를 반환합니다.
        본문은 원문 기반 텍스트(contentText)로 제공하며,
        digest는 AI가 추출/요약한 구조화 필드입니다(학습/검색/필터링 용도).
        원문 링크는 originalUrl 1개만 제공합니다.
        로그인 사용자라면 isScrapped 등 개인화 필드가 포함될 수 있습니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: announcements_getAnnouncementDetail
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 12345
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [announcementId, agency, title, startDate, endDate, status, contentText, originalUrl, externalApplyUrl, digest]
                properties:
                  announcementId:
                    type: integer
                    format: int64
                    description: 공고 PK
                    example: 12345

                  agency:
                    type: string
                    enum: [LH, SH]
                    description: 공고 기관 구분(LH/SH)
                    example: LH

                  title:
                    type: string
                    description: 공고명
                    example: "청년매입임대주택 모집 공고"

                  startDate:
                    type: string
                    format: date
                    description: 공고 시작일
                    example: "2025-12-01"

                  endDate:
                    type: string
                    format: date
                    description: 공고 마감일
                    example: "2026-01-15"

                  status:
                    type: string
                    description: 공고 접수 상태(앱 뱃지에 사용)
                    enum: [OPEN, DUE_SOON, UPCOMING, CLOSED]
                    example: DUE_SOON

                  dDay:
                    type: integer
                    nullable: true
                    description: 마감까지 남은 일수(DUE_SOON/OPEN에서 의미)
                    example: 3

                  contentText:
                    type: string
                    description: 원문 기반 본문 텍스트(가공 최소화)
                    example: "1. 신청자격\n- 만 19~34세...\n\n2. 제출서류\n- ..."

                  digest:
                    type: object
                    description: >
                      AI가 원문에서 추출/요약한 구조화 필드.
                      일부 필드는 원문에 없거나 추출 실패 시 null/빈 값일 수 있습니다.
                    required: [target, benefit, period, howToApply]
                    properties:
                      target:
                        type: string
                        nullable: true
                        description: 지원 대상 요약
                        example: "만 19~34세 무주택 청년"
                      benefit:
                        type: string
                        nullable: true
                        description: 지원 내용/금액 요약
                        example: "임대료 지원(월 최대 20만원)"
                      applyWindow:
                        type: string
                        nullable: true
                        description: 접수 기간 요약
                        example: "2026-01-01 ~ 2026-01-15"
                      period:
                        type: string
                        nullable: true
                        description: 지원 기간/거주 기간 등
                        example: "최대 2년(연장 가능)"
                      howToApply:
                        type: string
                        nullable: true
                        description: 신청 방법 요약
                        example: "온라인 신청(LH 청약센터)"
                      requirements:
                        type: array
                        description: 핵심 요건(불릿)
                        items: { type: string }
                        example: ["무주택 세대구성원", "소득 4분위 이하"]
                      documents:
                        type: array
                        description: 제출 서류(불릿)
                        items: { type: string }
                        example: ["신분증", "주민등록등본", "소득증빙서류"]
                      contact:
                        type: string
                        nullable: true
                        description: 문의처
                        example: "LH 콜센터 1600-1004"
                      notes:
                        type: string
                        nullable: true
                        description: 기타 참고/주의사항
                        example: "서류 미제출 시 자동 탈락"

                  originalUrl:
                    type: string
                    format: uri
                    description: 원문 공고 링크(외부 URL, PDF/HWP 포함 가능)
                    example: "https://example.org/announcements/12345/original"

                  externalApplyUrl:
                    type: string
                    format: uri
                    description: 신청하러가기 외부 링크(아웃 트래킹 대상)
                    example: "https://apply.example.org/form/12345"

                  isScrapped:
                    type: boolean
                    nullable: true
                    description: 로그인 사용자 기준 찜 여부(비로그인 시 null 또는 미포함 가능)
                    example: true

        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/announcements/{announcementId}/scrap:
    post:
      tags: [announcements]
      summary: 찜하기(스크랩) 추가
      description: >
        공고를 찜(스크랩)합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: announcements_addScrap
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 12345
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [announcements]
      summary: 찜하기(스크랩) 제거
      description: >
        공고 찜(스크랩)을 해제합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: announcements_removeScrap
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 12345
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/announcements/{announcementId}/outbound:
    post:
      tags: [announcements]
      summary: 신청하러가기(외부 이동) 기록
      description: >
        사용자가 공고 상세에서 '신청하러가기' 등 외부 링크로 이동하려는 행위를 기록합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리되며, 로그인 사용자만 호출할 수 있습니다.
        세부 이벤트 타입/UA/리퍼러 등 분석 데이터는 MVP 범위 밖으로 제외합니다.
      operationId: announcements_trackOutbound
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 12345
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/announcements/{announcementId}/eligibility/check:
    post:
      tags: [announcements]
      summary: 자격 자가 진단 실행
      description: >
        유저 프로필/온보딩 데이터와 공고 기준을 대조하여 자격 여부 및 심사 요소별 결과를 반환합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
      operationId: announcements_checkEligibility
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 12345
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [eligible, checks]
                properties:
                  eligible:
                    type: boolean
                    description: 최종 자격 충족 여부
                    example: true

                  rank:
                    type: string
                    nullable: true
                    description: 순위(해당 공고에서 순위 체계가 있을 때만 제공)
                    example: "1순위"

                  checks:
                    type: array
                    description: >
                      심사 요소별 판정 결과.
                      성공/실패 모두 제공.
                    items:
                      type: object
                      required: [key, passed, message]
                      properties:
                        passed:
                          type: boolean
                          description: 해당 요소 통과 여부
                          example: true
                        expected:
                          type: string
                          nullable: true
                          description: 기준 요약(선택)
                          example: "소득 4분위 이하"
                        actual:
                          type: string
                          nullable: true
                          description: 사용자 값 요약(선택)
                          example: "소득 3분위"
                        message:
                          type: string
                          description: 사용자 노출 문구(성공/실패/주의 모두 가능)
                          example: "소득 기준을 충족합니다."

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Not Found
          content:
