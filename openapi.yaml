                    example: false
                  deletedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: "삭제 시각(삭제되었을 때만)"
                    example: null
        "409":
          description: "Conflict"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  ############################################################
  # 5) 게이미피케이션 - 미션/배지
  ############################################################
  
  /api/gamification/missions:
      get:
        tags: [gamification]
        summary: "미션/레벨 진행 상태 조회"
        description: "유저의 레벨/경험치/칭호와 미션 진행 상태를 조회합니다."
        operationId: gamification_getMissions
        responses:
          "200":
            description: "OK"
            content:
              application/json:
                schema:
                  type: object
                  description: "미션 진행 상태 응답"
                  required: [level, exp, missions]
                  properties:
                    level:
                      type: integer
                      description: "현재 레벨"
                      example: 3
                    exp:
                      type: integer
                      description: "현재 누적 경험치"
                      example: 120
                    title:
                      type: string
                      nullable: true
                      description: "현재 칭호(없으면 null)"
                      example: "탐색왕"
                    expToNextLevel:
                      type: integer
                      nullable: true
                      description: "다음 레벨까지 남은 경험치(표시용)"
                      example: 80
                    missions:
                      type: array
                      description: "미션 목록"
                      items:
                        type: object
                        description: "미션 단건"
                        required: [missionId, name, category, progress, target, completed]
                        properties:
                          missionId:
                            type: string
                            description: "미션 식별자"
                            example: "msn_view_10"
                          name:
                            type: string
                            description: "미션 이름"
                            example: "공고 10회 조회"
                          category:
                            type: string
                            description: "미션 분류"
                            enum: [ATTENDANCE, ONBOARDING, USAGE, TODO, COMMUNITY]
                            example: "USAGE"
                          progress:
                            type: integer
                            description: "현재 진행 수치"
                            example: 4
                          target:
                            type: integer
                            description: "목표 수치"
                            example: 10
                          completed:
                            type: boolean
                            description: "완료 여부"
                            example: false
                          rewardExp:
                            type: integer
                            nullable: true
                            description: "완료 시 지급 경험치(표시용)"
                            example: 30
                          lastUpdatedAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: "진행도 갱신 시각"
                            example: "2025-12-29T08:55:00+09:00"
          "401":
            description: "Unauthorized"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"

          "500":
            description: "Internal Server Error"
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"

  /api/gamification/badges:
    get:
      tags: [gamification]
      summary: "배지 목록/장착 상태 조회"
      description: "유저가 획득한 배지와 현재 장착 배지를 조회합니다."
      operationId: gamification_listBadges
      responses:
        "200":
          description: "OK"
