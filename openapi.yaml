  ############################################################
  # 4) 커뮤니티 - 공고별 댓글/대댓글/좋아요/신고
  ############################################################
  
  /api/community/announcements/{announcementId}/comments:
    get:
      tags: [community]
      summary: "공고별 댓글 목록 조회(질문/답변 구조)"
      description: "공고 상세 하단의 Q/A 댓글을 페이지 기반으로 조회합니다. 비속어/개인정보/스팸/성적 표현은 마스킹(*) 처리될 수 있습니다."
      operationId: community_listComments
      parameters:
        - name: announcementId
          in: path
          required: true
          description: "댓글을 조회할 공고 ID"
          schema:
            type: string
            example: "ann_LH_20251229_000123"
        - name: page
          in: query
          required: false
          description: "0부터 시작하는 페이지 번호"
          schema:
            type: integer
            default: 0
            minimum: 0
            example: 0
        - name: size
          in: query
          required: false
          description: "페이지 크기"
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
            example: 20
        - name: sort
          in: query
          required: false
          description: "정렬 기준(기본: 최신순)"
          schema:
            type: string
            default: LATEST
            enum: [LATEST, POPULAR]
            example: "LATEST"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                description: "댓글 목록 응답"
                required: [items, meta]
                properties:
                  items:
                    type: array
                    description: "댓글 목록(parentId=0이면 질문, parentId>0이면 답변)"
                    items:
                      type: object
                      description: "댓글 단건"
                      required:
                        [
                          id, announcementId, parentId, kind,
                          content, contentFilter,
                          likeCount, reportCount,
                          deleted, createdAt, updatedAt,
                          author
                        ]
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: "댓글 PK"
                          example: 101
                        announcementId:
                          type: string
                          description: "공고 ID"
                          example: "ann_LH_20251229_000123"
                        parentId:
                          type: integer
                          format: int64
                          description: "부모 댓글 PK(없으면 0, 답변이면 질문 댓글 PK)"
                          example: 0
                        kind:
                          type: string
                          description: "댓글 유형(질문/답변)"
                          enum: [QUESTION, ANSWER]
                          example: "QUESTION"
                        content:
                          type: string
                          description: "댓글 내용(필터링 대상은 마스킹(*) 처리, 소프트삭제면 '삭제된 댓글입니다.'로 내려갈 수 있음)"
                          example: "이 공고는 **** 기준이 어떻게 되나요?"
                        contentFilter:
                          type: string
                          description: "콘텐츠 필터링 상태"
                          enum: [NONE, PROFANITY, SEXUAL, PERSONAL_INFO, SPAM]
                          example: "PROFANITY"
                        likeCount:
                          type: integer
                          description: "좋아요 수"
                          example: 7
                        reportCount:
                          type: integer
                          description: "누적 신고 수"
                          example: 2
                        deleted:
                          type: boolean
                          description: "소프트 삭제 여부(예: 신고 3회 누적 시 true)"
                          example: false
                        deletedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: "삭제 시각(삭제되지 않았다면 null)"
                          example: null
                        createdAt:
                          type: string
                          format: date-time
                          description: "생성 시각"
                          example: "2025-12-29T09:05:00+09:00"
                        updatedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: "수정 시각(수정 없으면 null)"
                          example: "2025-12-29T09:12:00+09:00"
                        author:
                          type: object
                          description: "작성자 정보"
                          required: [userId]
                          properties:
                            userId:
                              type: string
                              description: "작성자 유저 ID(ULID)"
                              example: "01JH6Z8R8V5K0Q9N7Z2F3M1T8A"
                            nickname:
                              type: string
                              nullable: true
                              description: "작성자 닉네임"
                              example: "siu"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [community]
      summary: "댓글 작성(질문/답변)"
      description: "질문은 parentId=0, 답변은 parentId에 질문 댓글 PK를 넣어 작성합니다. 필터링 대상은 저장/노출 정책에 따라 마스킹(*) 처리될 수 있습니다."
      operationId: community_createComment
      parameters:
        - name: announcementId
          in: path
          required: true
          description: "댓글을 작성할 공고 ID"
          schema:
            type: string
            example: "ann_LH_20251229_000123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "댓글 작성 요청"
              required: [parentId, content]
              properties:
                parentId:
                  type: integer
                  format: int64
                  description: "부모 댓글 PK(질문은 0, 답변은 질문 댓글 PK)"
                  example: 0
                content:
                  type: string
                  description: "댓글 내용(서버 정책으로 길이/비속어/개인정보/스팸/성적표현 필터링 적용)"
                  example: "원문 기준으로는 소득 기준이 어떻게 되나요?"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                type: object
                description: "댓글 생성 응답"
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
                    description: "생성된 댓글 PK"
                    example: 123
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

