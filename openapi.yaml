                  example: "서울특별시 마포구"
                birthDate:
                  type: string
                  format: date
                  description: 생년월일(YYYY-MM-DD). 연령 조건 판단에 사용됩니다.
                  example: "1999-01-01"
                incomeDecile:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: 소득분위(1~10). 건보료 기준 가이드 기반 입력값입니다.
                  example: 4
                householdSize:
                  type: integer
                  minimum: 1
                  description: 가구원 수(1 이상).
                  example: 1
