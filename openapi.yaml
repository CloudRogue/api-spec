  /api/mypage/reminder-settings:
    get:
      tags: [mypage]
      summary: 리마인더 설정 조회
      description: >
        마감일 리마인더(예: D-1, D-Day)를 어떤 채널로, 몇 시에 보낼지에 대한
        사용자 설정을 조회합니다. (공고별 설정은 지원하지 않음)

        enabled=false인 경우 리마인더를 발송하지 않습니다.
        sendAtHour는 0~23시(로컬 기준)입니다.
        JWT는 HttpOnly 쿠키로 인증됩니다. userId는 ULID를 사용합니다.
      operationId: mypage_getReminderSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, sendAtHour, rules]
                properties:
                  enabled:
                    type: boolean
                    description: 리마인더 기능 사용 여부 (false면 발송하지 않음)
                    example: true
                  sendAtHour:
                    type: integer
                    minimum: 0
                    maximum: 23
                    description: >
                      리마인더 발송 시각(시 단위, 0~23).
                      분/초는 서버 정책에 따르며 기본은 정각(00분)으로 동작할 수 있습니다.
                    example: 9
                  rules:
                    type: array
                    description: >
                      리마인더 규칙 목록. 기본은 D-1, D-Day 두 가지 규칙을 사용합니다.
                      공고별 예외/개별 설정은 지원하지 않습니다.
                    items:
                      type: object
                      required: [when, channel]
                      properties:
                        when:
                          type: string
                          description: 발송 기준일
                          enum: [D_MINUS_1, D_DAY]
                          example: D_MINUS_1
                        channel:
                          type: string
                          description: 발송 채널
                          enum: [KAKAO_ALIMTALK, EMAIL]
                          example: KAKAO_ALIMTALK
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [mypage]
      summary: 리마인더 설정 저장
      description: >
        마감일 리마인더 설정을 저장(전체 덮어쓰기)합니다. (공고별 설정은 지원하지 않음)

        enabled=false로 저장하면 리마인더를 발송하지 않습니다.
        rules는 사용할 규칙 목록이며, when+channel 조합은 중복되지 않도록 서버에서 검증합니다.
        JWT는 HttpOnly 쿠키로 인증됩니다. userId는 ULID를 사용합니다.
      operationId: mypage_putReminderSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, sendAtHour, rules]
              properties:
                enabled:
                  type: boolean
                  description: 리마인더 기능 사용 여부
                  example: true
                sendAtHour:
                  type: integer
                  minimum: 0
                  maximum: 23
                  description: 발송 시각(시 단위, 0~23)
                  example: 9
                rules:
                  type: array
                  description: >
                    리마인더 규칙 목록. 기본은 D-1, D-Day를 사용합니다.
                    공고별 예외/개별 설정은 지원하지 않습니다.
                  items:
                    type: object
                    required: [when, channel]
                    properties:
                      when:
                        type: string
                        description: 발송 기준일
                        enum: [D_MINUS_1, D_DAY]
                        example: D_DAY
                      channel:
                        type: string
                        description: 발송 채널
                        enum: [KAKAO_ALIMTALK, EMAIL]
                        example: EMAIL
      responses:
        "204":
          description: No Content (저장 완료)
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mypage/interest-alert-settings:
    get:
      tags: [mypage]
      summary: 관심 공고 알림 설정 조회
      description: >
        관심 공고 알림(관심있을 만한 공고 추천, 신규 공고, 재추첨 공고 등) 수신 설정을 조회합니다.
        JWT는 HttpOnly 쿠키로 인증됩니다. userId는 ULID를 사용합니다.
      operationId: mypage_getInterestAlertSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, types]
                properties:
                  enabled:
                    type: boolean
                    description: 관심 공고 알림 기능 사용 여부 (false면 전체 미발송)
                    example: true
                  types:
                    type: array
                    description: >
                      수신할 관심 공고 알림 유형 목록.
