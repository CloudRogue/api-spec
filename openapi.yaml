  /api/mypage/scraps:
    get:
      tags: [mypage]
      summary: 내가 찜한 공고 리스트
      description: >
        유저가 찜(스크랩)한 공고 목록을 페이지네이션으로 조회합니다.
        JWT는 HttpOnly 쿠키로 인증됩니다.
      operationId: mypage_listScraps
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: 0부터 시작하는 페이지 번호
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: 페이지 크기
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, totalElements, totalPages]
                properties:
                  items:
                    type: array
                    description: 찜(스크랩)한 공고 목록
                    items:
                      type: object
                      required: [announcementId, provider, title, endDate, publisher]
                      properties:
                        announcementId:
                          type: integer
                          format: int64
                          description: 공고 PK (오픈된 공고 정보의 내부 식별자)
                          example: 12345
                        provider:
                          type: string
                          description: 공고 제공처
                          enum: [LH, SH]
                          example: LH
                        title:
                          type: string
                          description: 공고명
                          example: "청년매입임대주택 모집 공고"
                        endDate:
                          type: string
                          format: date
                          description: 마감일(YYYY-MM-DD)
                          example: "2026-01-15"
                        publisher:
                          type: string
                          description: 발행처(기관/부서명 등)
                          example: "LH 한국토지주택공사"
                  page:
                    type: integer
                    minimum: 0
                    description: 현재 페이지 번호(0부터)
                    example: 0
                  size:
                    type: integer
                    minimum: 1
                    maximum: 100
                    description: 페이지 크기
                    example: 20
                  totalElements:
                    type: integer
                    minimum: 0
                    description: 전체 항목 수
                    example: 134
                  totalPages:
                    type: integer
                    minimum: 0
                    description: 전체 페이지 수
                    example: 7
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mypage/outbounds:
    get:
      tags: [mypage]
      summary: 신청하러가기(외부 이동) 눌러본 공고 기록
      description: >
        공고 상세에서 '신청하러가기'를 눌러 외부 링크로 이동했던 공고 목록입니다.
        실제 신청 여부(applied)는 유저가 이후에 입력하는 값입니다.
        JWT는 HttpOnly 쿠키로 인증됩니다.
      operationId: mypage_listOutbounds
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: 0부터 시작하는 페이지 번호
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: 페이지 크기
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    description: 신청하러가기(외부 이동) 기록 목록
                    items:
                      type: object
                      required: [outboundId, announcementId, agency, clickedAt, applied]
                      properties:
                        outboundId:
                          type: integer
                          format: int64
                          description: 신청하러가기(외부 이동) 기록 PK
                          example: 98765
                        announcementId:
                          type: integer
                          format: int64
                          description: 공고 PK
                          example: 12345
                        agency:
                          type: string
                          enum: [LH, SH]
                          description: 공고 기관 구분(LH/SH)
                          example: LH
                        clickedAt:
                          type: string
                          format: date-time
                          description: 사용자가 '신청하러가기'를 클릭한 시각(ISO-8601)
                          example: "2025-12-29T00:10:15+09:00"
                        applied:
                          type: boolean
                          description: 실제 신청 여부(유저가 입력)
                          example: false
                        appliedAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: 실제 신청 시각(유저가 입력, 미입력 시 null)
                          example: null
                  meta:
                    type: object
                    required: [page, size, totalElements, totalPages]
                    properties:
                      page:
                        type: integer
                        minimum: 0
                        description: 현재 페이지 번호(0부터)
                        example: 0
                      size:
                        type: integer
                        minimum: 1
                        maximum: 100
                        description: 페이지 크기
                        example: 20
                      totalElements:
                        type: integer
                        minimum: 0
                        description: 전체 항목 수
                        example: 134
                      totalPages:
                        type: integer
                        minimum: 0
                        description: 전체 페이지 수
                        example: 7
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mypage/outbounds/{announcementId}/applied:
    put:
      tags: [mypage]
      summary: 실제 신청 여부 등록/변경
      description: >
        사용자가 '신청하러가기'를 눌렀던 공고(announcementId)에 대해
        실제 신청 여부를 등록/변경합니다.
        JWT는 HttpOnly 쿠키로 인증됩니다.
      operationId: mypage_putAppliedStatus
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: 공고 PK
          example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applied]
              properties:
                applied:
                  type: boolean
                  description: true=신청함, false=신청 안 함
                  example: true
                appliedAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    신청 시각(선택). applied=true일 때만 의미가 있으며,
                    미전달 시 서버가 현재 시각으로 기록할 수 있습니다.
                  example: "2025-12-29T00:10:15+09:00"
      responses:
        "204":
          description: No Content (저장 완료)
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Not Found (해당 공고의 외부 이동 기록이 없음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mypage/notification-settings/kakao:
