        자연어 요청을 기반으로 맞춤 공고/정책 추천 결과를 반환합니다.
        인증은 HttpOnly 쿠키(JWT)로 처리됩니다.
        비로그인(쿠키 없음/만료)이면 401, 온보딩 미완료면 403을 반환합니다.
      operationId: chat_getRecommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: 사용자 자연어 요청(추천 중심)
                  example: "서울 청년인데 지금 신청 가능한 거 추천해줘"
                page:
                  type: integer
                  minimum: 0
                  default: 0
                  description: 0부터 시작하는 페이지 번호(선택)
                  example: 0
                size:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                  description: 페이지 크기(선택)
                  example: 20

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    description: 추천 결과 카드 목록
                    items:
                      type: object
                      required: [type, pk, text]
                      properties:
                        type:
                          type: string
                          description: 추천 대상 타입
                          enum: [ANNOUNCEMENT, POLICY]
                          example: ANNOUNCEMENT
                        pk:
                          type: integer
                          format: int64
                          description: 추천 대상 PK (공고 PK 또는 정책 PK)
                          example: 12345
                        text:
                          type: string
                          description: 추천 카드에 노출할 텍스트(한 줄 요약/추천 이유 포함 가능)
                          example: "마감 임박: 서울 청년 대상 중개보수 지원(중위 150% 이하)"

                  meta:
                    type: object
                    required: [page, size, totalElements, totalPages]
                    properties:
                      page: { type: integer, minimum: 0, example: 0, description: 현재 페이지 번호(0부터) }
                      size: { type: integer, minimum: 1, maximum: 100, example: 20, description: 페이지 크기 }
                      totalElements: { type: integer, minimum: 0, example: 42, description: 전체 항목 수 }
                      totalPages: { type: integer, minimum: 0, example: 3, description: 전체 페이지 수 }

        "400":
          description: Bad Request (요청 바디 검증 실패)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Unauthorized (비로그인/토큰 만료)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "403":
          description: Forbidden (온보딩 미완료)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "429":
          description: Too Many Requests (요청 과다/레이트리밋)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      $ref: "./components/schemas/common.yml#/ErrorResponse"
    PageMeta:
      $ref: "./components/schemas/common.yml#/PageMeta"


