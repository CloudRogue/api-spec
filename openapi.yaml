                types:
                  type: array
                  description: 수신할 관심 공고 알림 유형 목록
                  items:
                    type: string
                    enum: [RECOMMENDED, NEW_ANNOUNCEMENT, REOPENED]
                channels:
                  type: array
                  description: 발송 채널 목록(선택). 미지정 시 서버 기본 채널 정책 적용 가능
                  items:
                    type: string
                    enum: [KAKAO_ALIMTALK, EMAIL]
      responses:
        "204":
          description: No Content (저장 완료)
        "400":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
